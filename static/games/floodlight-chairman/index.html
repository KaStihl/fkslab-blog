<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Floodlight Chairman</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A football club management game: run the team, the stadium and the money of a fictional club.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a sticky floodlit scoreboard bar with a tab rail, then a 1200px column of panels; matchday takes over the column with the live pitch. */
:root{
  --bg:#0a1b16;          /* night turf */
  --bg-2:#0d221c;
  --panel:#10281f;       /* dugout green */
  --panel-2:#163427;
  --line:#264a3d;
  --chalk:#eef1e4;       /* pitch-line white */
  --dim:#9fb5a8;
  --faint:#6f877b;
  --amber:#ffb340;       /* sodium floodlight */
  --amber-ink:#2a1a00;
  --good:#62d893;
  --bad:#ff7466;
  --warn:#ffd36b;
  --sky:#8ccaff;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --f-display:'Big Shoulders Display','Arial Narrow','Roboto Condensed',Impact,sans-serif;
  --f-body:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--chalk)}
body{
  margin:0;font-family:var(--f-body);font-size:14px;line-height:1.45;min-height:100%;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 80px,rgba(0,0,0,0) 80px 160px),
    radial-gradient(1200px 500px at 50% -200px,rgba(255,179,64,.10),rgba(0,0,0,0) 70%),
    var(--bg);
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg-2)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:0;text-wrap:balance;line-height:1}
h2{font-size:22px;font-weight:800}
h3{font-size:17px;font-weight:800;color:var(--dim)}
.num,.tbl td.n,.tbl th.n{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
.dim{color:var(--dim)} .faint{color:var(--faint)}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .amber{color:var(--amber)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(var(--bg-2),rgba(13,34,28,.97));border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.top-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:14px 20px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);font-weight:900;font-size:20px;letter-spacing:.06em;line-height:.85;color:var(--amber);text-transform:uppercase}
.brand span{display:block;color:var(--chalk);font-size:13px;letter-spacing:.32em}
.clubline{display:flex;align-items:center;gap:10px;min-width:0}
.clubline b{font-family:var(--f-display);font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clubline small{display:block;color:var(--dim);font-size:12px}
.kpis{display:flex;gap:18px;margin-left:auto;flex-wrap:wrap}
.kpi label{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.kpi b{font-family:var(--f-mono);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.tabs{max-width:1200px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px 8px;color:var(--dim);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;letter-spacing:.02em}
.tab:hover{color:var(--chalk)}
.tab.on{color:var(--chalk);border-bottom-color:var(--amber)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);color:var(--chalk);padding:7px 12px;border-radius:5px;cursor:pointer;font-weight:600;font-size:13px;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--dim)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.bad{border-color:rgba(255,116,102,.5);color:var(--bad);background:transparent}
.btn.ghost{background:transparent}
.btn.go{font-family:var(--f-display);font-size:19px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:8px 18px;background:var(--amber);color:var(--amber-ink);border:0;box-shadow:0 0 0 1px rgba(255,179,64,.4),0 0 24px rgba(255,179,64,.25)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 10px;cursor:pointer;color:var(--dim);font-weight:600;font-size:12.5px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--amber);color:var(--amber-ink)}

/* layout */
main{max-width:1200px;margin:0 auto;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:860px){.g-main{grid-template-columns:minmax(0,1fr)}}
@media (max-width:400px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.spacer{flex:1}
.label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}
.big{font-family:var(--f-display);font-weight:900;font-size:40px;line-height:.9}
.chip{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.04em;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.chip.good{border-color:rgba(98,216,147,.45);color:var(--good)}
.chip.bad{border-color:rgba(255,116,102,.45);color:var(--bad)}
.chip.warn{border-color:rgba(255,211,107,.45);color:var(--warn)}
.chip.amber{border-color:rgba(255,179,64,.5);color:var(--amber)}
.pos{display:inline-block;width:28px;text-align:center;font-size:10.5px;font-weight:700;border-radius:3px;padding:1px 0;letter-spacing:.04em}
.pos.GK{background:#5b4a12;color:#ffe08a}.pos.DF{background:#123d5a;color:#a9dcff}.pos.MF{background:#1f4d2b;color:#a5efbe}.pos.FW{background:#5a1f1b;color:#ffb3aa}
.form{display:inline-flex;gap:3px}
.form i{font-style:normal;width:17px;height:17px;border-radius:3px;display:inline-grid;place-items:center;font-size:10px;font-weight:800;color:#0a1b16}
.form .W{background:var(--good)}.form .D{background:#c9c9b8}.form .L{background:var(--bad)}
.ovr{display:inline-grid;place-items:center;min-width:30px;height:22px;border-radius:4px;font-family:var(--f-mono);font-weight:600;font-size:12.5px;background:var(--panel-2);border:1px solid var(--line)}
.ovr.t1{color:#0a1b16;background:var(--amber);border-color:var(--amber)}
.ovr.t2{color:var(--good);border-color:rgba(98,216,147,.4)}
.ovr.t4{color:var(--faint)}
.stars{position:relative;display:inline-block;font-size:12px;letter-spacing:1px;color:#33554a;line-height:1}
.stars::before{content:"★★★★★"}
.stars i{position:absolute;inset:0 auto 0 0;overflow:hidden;white-space:nowrap;color:var(--amber);font-style:normal}
.stars i::before{content:"★★★★★"}
.meter{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--amber);border-radius:99px}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center}
.bars .meter{height:7px}
.skbar i{background:linear-gradient(90deg,var(--amber),#ffd18a)}

/* tables */
.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600;text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:default}
.tbl th.s{cursor:pointer}.tbl th.s:hover{color:var(--chalk)}
.tbl td{padding:6px 6px;border-bottom:1px solid rgba(38,74,61,.55);white-space:nowrap}
.tbl td.n,.tbl th.n{text-align:right}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:rgba(255,255,255,.03)}
.tbl tr.me td{background:rgba(255,179,64,.09)}
.tbl tr.up td:first-child{box-shadow:inset 3px 0 0 var(--good)}
.tbl tr.down td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.tbl .nm{font-weight:600}
.cl{display:inline-flex;align-items:center;gap:7px}

/* inbox */
.news{display:flex;flex-direction:column}
.news .it{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:9px 0;border-bottom:1px solid rgba(38,74,61,.6)}
.news .it:last-child{border-bottom:0}
.news .w{font-family:var(--f-mono);font-size:11px;color:var(--faint);padding-top:2px}
.news .t{min-width:0}
.news .k-good .t b:first-child{color:var(--good)}
.news .k-bad .t b:first-child{color:var(--bad)}
.news .k-offer .t b:first-child{color:var(--amber)}

/* next match card */
.fixture{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;text-align:center}
.fixture .tm{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.fixture .tm b{font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase;line-height:1}
.fixture .vs{font-family:var(--f-display);font-weight:900;font-size:28px;color:var(--amber)}

/* tactics board */
.board{position:relative;width:100%;max-width:520px;aspect-ratio:68/80;margin:0 auto;border-radius:6px;overflow:hidden;
  background:repeating-linear-gradient(0deg,#1b5a37 0 10%,#1e6340 10% 20%);border:2px solid rgba(255,255,255,.18)}
.board::before{content:"";position:absolute;left:20%;right:20%;bottom:-1px;height:16%;border:2px solid rgba(255,255,255,.35);border-bottom:0}
.board::after{content:"";position:absolute;left:50%;top:0;width:34%;aspect-ratio:1;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.3);border-radius:50%}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;cursor:pointer;padding:0;width:84px}
.slot .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:12px;border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.slot .nm{font-size:11px;font-weight:700;background:rgba(5,15,12,.75);padding:1px 6px;border-radius:3px;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.sel .dot{outline:3px solid var(--amber);outline-offset:2px}
.slot.empty .dot{background:rgba(0,0,0,.35)!important;border-style:dashed}
.slot .ps{font-size:9px;font-weight:800;color:rgba(255,255,255,.75);letter-spacing:.06em}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(3,10,8,.72);display:grid;place-items:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);width:min(640px,100%);max-height:100%;overflow:auto;padding:20px}
.field{display:flex;flex-direction:column;gap:4px}
.field input,.field select,input.inp,select.inp,textarea.inp{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:7px 9px;min-width:0}
textarea.inp{width:100%;min-height:90px;font-family:var(--f-mono);font-size:11px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--chalk);color:#0a1b16;font-weight:700;padding:10px 16px;border-radius:6px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast[hidden]{display:none}

/* matchday */
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:#050d0b;border:1px solid #1f3a31;border-radius:6px;padding:10px 14px;box-shadow:inset 0 0 30px rgba(255,179,64,.06)}
.scoreboard .tn{display:flex;align-items:center;gap:10px;min-width:0;font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase}
.scoreboard .tn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scoreboard .tn.r{justify-content:flex-end;text-align:right}
.scoreboard .sc{font-family:var(--f-mono);font-weight:600;font-size:34px;color:var(--amber);text-shadow:0 0 12px rgba(255,179,64,.55);letter-spacing:.06em;text-align:center;line-height:1}
.scoreboard .mn{display:block;font-size:12px;color:var(--chalk);text-shadow:none;letter-spacing:.1em;margin-top:4px}
.pitchwrap{position:relative;background:#06110e;border-radius:6px;overflow:hidden;border:1px solid #1f3a31}
.pitchwrap canvas{display:block;width:100%;height:auto}
.comm{max-height:380px;overflow:auto;display:flex;flex-direction:column}
.comm .c{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid rgba(38,74,61,.5);font-size:13px}
.comm .c .m{font-family:var(--f-mono);color:var(--faint);font-size:12px;text-align:right}
.comm .c.goal{color:var(--amber);font-weight:700}
.comm .c.card-y .t::before{content:"";display:inline-block;width:8px;height:11px;background:var(--warn);border-radius:1px;margin-right:6px;vertical-align:-1px}
.comm .c.card-r .t::before{content:"";display:inline-block;width:8px;height:11px;background:var(--bad);border-radius:1px;margin-right:6px;vertical-align:-1px}
.comm .c.key{color:var(--chalk);font-weight:600}
.stat2{display:grid;grid-template-columns:40px 1fr 40px;gap:8px;align-items:center;font-size:12px}
.stat2 .b{display:flex;height:6px;border-radius:9px;overflow:hidden;background:var(--panel-2)}
.stat2 .b i{display:block;height:100%}
.hero{padding:40px 0 20px;display:grid;gap:12px}
.hero h1{font-size:clamp(48px,11vw,104px);font-weight:900;line-height:.82;letter-spacing:.01em}
.hero h1 span{color:var(--amber);display:block}
.hero p{max-width:60ch;color:var(--dim);font-size:15px;margin:0}
.clubpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.cp{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;cursor:pointer}
.cp:hover,.cp.on{border-color:var(--amber)}
.cp b{font-family:var(--f-display);font-size:18px;font-weight:800;text-transform:uppercase;line-height:1}
.cp .meta{grid-column:2;color:var(--dim);font-size:12px}
.build-stripe{background:repeating-linear-gradient(45deg,rgba(255,211,107,.18) 0 8px,transparent 8px 16px)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:640px){
  .kpis{gap:12px;margin-left:0;width:100%;justify-content:space-between}
  .btn.go{margin-left:auto}
  .big{font-size:32px}
  .scoreboard .tn{font-size:15px}.scoreboard .sc{font-size:26px}
  .tbl .hide-sm{display:none}
}
</style>
</head>
<body>
<header class="top" id="top" hidden></header>
<main id="main"></main>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>
<script>
'use strict';
/* =========================================================
   Floodlight Chairman — an original club management game.
   All clubs, players, leagues and sponsors are fictional.
   ========================================================= */
const SAVE_KEY='floodlight-chairman-v1';
let S=null;
const UI={view:'home',sel:null,sqSort:'pos',sqDir:1,sqPos:'ALL',mkt:{pos:'ALL',max:0,minO:0,age:40,sort:'ovr',src:'all'},leagueDiv:null,leagueRound:null,live:null,sound:false,trf:'market',pre:null};
const R=Math.random, ri=(a,b)=>a+Math.floor(R()*(b-a+1)), pick=a=>a[Math.floor(R()*a.length)], clamp=(v,a,b)=>v<a?a:v>b?b:v;
const gauss=()=>{let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
function money(n){const neg=n<0;n=Math.abs(n);let s;if(n>=1e6)s=(n/1e6).toFixed(n>=1e8?0:n>=1e7?1:2)+'M';else if(n>=1e4)s=Math.round(n/1e3)+'k';else if(n>=1e3)s=(n/1e3).toFixed(1)+'k';else s=Math.round(n)+'';return (neg?'−':'')+'€'+s}
const int=n=>Math.round(n).toLocaleString('en-US');
const ord=n=>n+(['th','st','nd','rd'][(n%100-20)%10]||['th','st','nd','rd'][n%100]||'th');

/* ---------- constants ---------- */
const DIVS=['Premier Division','First Division','Second Division'];
const TV=[170000,80000,28000];
const IDEAL=[26,17,11];
const PRIZE=[360000,130000,45000];
const SPF=[15,9,5.5];
const SK=['gk','tk','pa','sh','pc','st'];
const SKN={gk:'Goalkeeping',tk:'Tackling',pa:'Passing',sh:'Shooting',pc:'Pace',st:'Stamina'};
const OW={GK:{gk:.75,pa:.1,st:.1,pc:.05},DF:{tk:.45,pc:.2,pa:.15,st:.15,sh:.05},MF:{pa:.4,st:.2,tk:.15,sh:.15,pc:.1},FW:{sh:.45,pc:.25,pa:.15,st:.15}};
const GENF={GK:{gk:1.08,tk:.3,pa:.7,sh:.25,pc:.6,st:.75},DF:{gk:.12,tk:1.06,pa:.85,sh:.5,pc:.88,st:.9},MF:{gk:.12,tk:.8,pa:1.06,sh:.82,pc:.85,st:1},FW:{gk:.12,tk:.45,pa:.85,sh:1.07,pc:1,st:.9}};
const POSO={GK:0,DF:1,MF:2,FW:3};
const FORMS={'4-4-2':[4,4,2],'4-3-3':[4,3,3],'4-2-3-1':[4,2,3,1],'3-5-2':[3,5,2],'5-3-2':[5,3,2],'4-5-1':[4,5,1],'3-4-3':[3,4,3],'4-1-4-1':[4,1,4,1]};
const MENT=['Defensive','Cautious','Balanced','Attacking','All-out attack'];
const MENT_ATT=[.68,.84,1,1.16,1.34], MENT_CONC=[.74,.87,1,1.13,1.32];
const PRESS=['Sit deep','Normal press','High press'], PRESS_MID=[.95,1,1.06], PRESS_FAT=[.8,1,1.35];
const FOCI={balanced:'Balanced',attack:'Finishing & pace',defence:'Defending',passing:'Passing & build-up',fitness:'Fitness',rest:'Rest & recovery'};
const INTEN=['Light','Normal','Hard'];
const CAL=['L0','L1','C0','L2','L3','L4','C1','L5','L6','L7','C2','L8','L9','L10','L11','C3','L12','L13','L14','L15','C4','L16','L17','L18','L19','L20','L21','C5'];

function ovrAt(p,pos){const w=OW[pos];let s=0;for(const k in w)s+=w[k]*p.sk[k];return Math.round(s)}

function value(p){const o=ovr(p);const af=p.age<=21?1.35:p.age<=24?1.2:p.age<=28?1:p.age<=30?.72:p.age<=32?.45:.25;const pb=p.age<=24?Math.pow(1.045,Math.max(0,p.pot-o)):1;return Math.max(5000,Math.round(80000*Math.pow(1.11,o-40)*af*pb/5000)*5000)}
function wageFor(p){const o=ovr(p);const af=p.age<=20?.6:p.age<=23?.85:p.age>=32?.85:1;return Math.max(250,Math.round(400*Math.pow(1.11,o-40)*af/50)*50)}

function makePlayer(pos,target,age){

/* ---------- formations ---------- */
function slots(form){
  const L=FORMS[form];const out=[{pos:'GK',x:.05,y:.5}];
  L.forEach((n,i)=>{const pos=i===0?'DF':i===L.length-1?'FW':'MF';const x=.2+i*(.46/(L.length-1));const s=Math.min(.72,.24*(n-1));for(let j=0;j<n;j++)out.push({pos,x,y:n===1?.5:.5-s/2+j*s/(n-1)})});
  return out;
}
function autoPick(c){
  const sl=slots(c.tac.form);const pool=c.squad.map(P).filter(avail);const used=new Set();const lu=new Array(sl.length).fill(null);
  const order=[0,...sl.map((s,i)=>i).filter(i=>i>0&&sl[i].pos==='FW'),...sl.map((s,i)=>i).filter(i=>sl[i].pos==='DF'),...sl.map((s,i)=>i).filter(i=>sl[i].pos==='MF')];
  for(const i of order){let best=null,bv=-1;for(const p of pool){if(used.has(p.id))continue;let v=ovrAt(p,sl[i].pos)*(p.pos===sl[i].pos?1:.88)*(.8+.2*p.fit/100);if((sl[i].pos==='GK')!==(p.pos==='GK'))v*=.25;if(v>bv){bv=v;best=p}}if(best){lu[i]=best.id;used.add(best.id)}}
  c.lineup=lu;
}
function benchOf(c){
  const inXI=new Set(c.lineup);const rest=c.squad.map(P).filter(p=>avail(p)&&!inXI.has(p.id)).sort((a,b)=>ovr(b)-ovr(a));
  const out=[];const gk=rest.find(p=>p.pos==='GK');if(gk)out.push(gk.id);
  for(const p of rest){if(out.length>=7)break;if(!out.includes(p.id))out.push(p.id)}
  return out;
}
function ensureLineup(c){
  const sl=slots(c.tac.form);
  if(!c.lineup||c.lineup.length!==sl.length){autoPick(c);return}
  const sq=new Set(c.squad);const seen=new Set();
  c.lineup=c.lineup.map(id=>(id!=null&&sq.has(id)&&avail(P(id))&&!seen.has(id)&&(seen.add(id),true))?id:null);
  if(c.lineup.some(x=>x==null)){
    const pool=c.squad.map(P).filter(p=>avail(p)&&!c.lineup.includes(p.id));
    c.lineup.forEach((id,i)=>{if(id!=null)return;let best=null,bv=-1;for(const p of pool){if(c.lineup.includes(p.id))continue;let v=ovrAt(p,sl[i].pos)*(p.pos===sl[i].pos?1:.88);if((sl[i].pos==='GK')!==(p.pos==='GK'))v*=.25;if(v>bv){bv=v;best=p}}if(best)c.lineup[i]=best.id});
  }
  const g0=c.lineup[0]!=null?P(c.lineup[0]):null;
  if(!g0||g0.pos!=='GK'){const gk=c.squad.map(P).filter(p=>p.pos==='GK'&&avail(p)&&!c.lineup.includes(p.id)).sort((a,b)=>ovr(b)-ovr(a))[0];if(gk)c.lineup[0]=gk.id}
}
function squadAvg(c){const a=c.squad.map(P).map(ovr).sort((x,y)=>y-x).slice(0,14);return a.reduce((s,x)=>s+x,0)/Math.max(1,a.length)}

function genWorld(){
  S={v:1,nid:1,season:1,year:2026,week:0,players:{},clubs:[],free:[],user:-1,manager:'',news:[],offers:[],builds:[],history:[],
     fix:[],res:[[],[],[]],cup:null,ledger:null,lastFin:null,balHist:[],board:{conf:60},train:{focus:'balanced',inten:1},
     sponsor:null,sponsorOffers:[],loan:0,autoSub:true,review:null,sacked:false,lastWeek:null,oid:1,titles:{league:0,cup:0}};
  const names=new Set();const clubs=[];
  while(clubs.length<36){
    const town=pick(PRE)+pick(SUF);const t=town[0].toUpperCase()+town.slice(1);
    if(names.has(t))continue;names.add(t);
    const typ=pick(CLUBT);const col=pick(COLS);
    clubs.push({id:clubs.length,town:t,name:typ==='FC'?t+' FC':(R()<.5?t+' '+typ:(typ==='Dynamo'||typ==='Sporting'||typ==='Olympic'?typ+' '+t:t+' '+typ)),c1:col[0],c2:col[1],pat:pick(PATS),ground:t+pick(GROUNDS)});
  }
  clubs.forEach((c,i)=>{
    const d=i<12?0:i<24?1:2;c.div=d;
    c.rep=d===0?ri(68,90):d===1?ri(48,67):ri(26,46);
  });
  // ensure ordering of reputation inside divisions doesn't matter; build squads
  for(const c of clubs){
    c.fans=Math.round(3000+c.rep*c.rep*4.2);
    c.cash=Math.round(c.rep*c.rep*450/10000)*10000;
    c.squad=[];c.form=[];c.tac={form:pick(['4-4-2','4-3-3','4-2-3-1','4-4-2','4-5-1','3-5-2']),ment:2,press:1};c.lineup=null;
    const tgt=34+c.rep*.46;
    const plan=[['GK',2],['DF',7],['MF',7],['FW',5]];
    for(const [pos,n] of plan)for(let k=0;k<n;k++){const p=makePlayer(pos,tgt+(k<(pos==='GK'?1:pos==='FW'?2:4)?2:-4)+gauss()*3.5,randAge());p.club=c.id;S.players[p.id]=p;c.squad.push(p.id)}
    for(let k=0;k<ri(0,2);k++){const pos=pick(['DF','MF','FW']);const p=makePlayer(pos,tgt-6,ri(17,20));p.club=c.id;S.players[p.id]=p;c.squad.push(p.id)}
    const total=Math.max(3500,Math.round(c.fans*.92/500)*500);
    const share=[.34,.34,.16,.16];
    c.stands=share.map((s,i)=>{const cap=Math.round(total*s/100)*100;const seated=c.div===0?true:c.div===1?(i<2||R()<.4):(i===0);const roof=c.div===0?true:c.div===1?i<2||R()<.3:i===0;return {cap,seated,roof,boxes:c.div===0?(i===0?16:i===1?8:0):c.div===1&&i===0?4:0}});
    const L=c.div===0?2:c.div===1?1:0;
    c.fac={shop:L,food:L,parking:L,training:L,youth:clamp(L+ri(-1,1),0,3),medical:L,screen:Math.max(0,L-1)};
    c.price=Math.round(IDEAL[c.div]*1.25);
    autoPick(c);
  }
  S.clubs=clubs;
  for(let k=0;k<36;k++){const pos=pick(['GK','DF','DF','MF','MF','FW']);const p=makePlayer(pos,ri(40,66),ri(19,33));p.club=-1;p.contract=0;S.players[p.id]=p;S.free.push(p.id)}
  return S;
}

/* ---------- fixtures & cup ---------- */
function roundRobin(ids){
  const t=shuffle(ids.slice());const n=t.length;const rounds=[];
  for(let r=0;r<n-1;r++){const pr=[];for(let i=0;i<n/2;i++){let h=t[i],a=t[n-1-i];if((r+i)%2)[h,a]=[a,h];pr.push([h,a])}rounds.push(pr);t.splice(1,0,t.pop())}
  return rounds.concat(rounds.map(rd=>rd.map(([h,a])=>[a,h])));
}
const divClubs=d=>S.clubs.filter(c=>c.div===d).map(c=>c.id);
function newFixtures(){S.fix=[0,1,2].map(d=>roundRobin(divClubs(d)));S.res=[[],[],[]]}
function newCup(){S.cup={round:0,alive:S.clubs.map(c=>c.id),ties:null,log:[],winner:null,runnerUp:null,names:[]}}
function cupRoundName(n){return n===2?'Final':n===4?'Semi-finals':n===8?'Quarter-finals':n===16?'Round of 16':n===32?'Round of 32':'Preliminary round'}
function drawCup(){
  const cu=S.cup;if(cu.ties||cu.winner!=null)return;
  const n=cu.alive.length;let p=1;while(p*2<=n)p*=2;
  let players=cu.alive.slice(),byes=[];
  if(n>p){const sorted=cu.alive.slice().sort((a,b)=>C(b).rep-C(a).rep);const k=2*(n-p);players=sorted.slice(n-k);byes=sorted.slice(0,n-k)}
  shuffle(players);const ties=[];for(let i=0;i<players.length;i+=2)ties.push({h:players[i],a:players[i+1],res:null});
  cu.ties=ties;cu.byes=byes;cu.names[cu.round]=cupRoundName(players.length);
}
function weekFixtures(){
  if(S.week>=CAL.length)return [];
  const ev=CAL[S.week];
  if(ev[0]==='L'){const r=+ev.slice(1);const out=[];for(let d=0;d<3;d++)for(const [h,a] of S.fix[d][r])out.push({h,a,div:d,r,cup:false});return out}
  if(S.cup.winner!=null)return [];
  drawCup();return S.cup.ties.map((t,i)=>({h:t.h,a:t.a,cup:true,tie:i}));
}
function weekLabel(w=S.week){if(w>=CAL.length)return 'Season over';const ev=CAL[w];if(ev[0]==='L')return 'League · Matchday '+(+ev.slice(1)+1);const nm=S.cup.names[S.cup.round]||cupRoundName(S.cup.alive.length>32?36:S.cup.alive.length);return 'Crown Cup · '+nm}
function userFixture(){return weekFixtures().find(f=>f.h===S.user||f.a===S.user)||null}

/* ---------- tables ---------- */
function table(d){
  const rows={};for(const id of divClubs(d))rows[id]={id,p:0,w:0,dr:0,l:0,gf:0,ga:0,pts:0,form:[]};
  for(const m of S.res[d]){const h=rows[m.h],a=rows[m.a];if(!h||!a)continue;h.p++;a.p++;h.gf+=m.hg;h.ga+=m.ag;a.gf+=m.ag;a.ga+=m.hg;
    if(m.hg>m.ag){h.w++;a.l++;h.pts+=3;h.form.push('W');a.form.push('L')}else if(m.hg<m.ag){a.w++;h.l++;a.pts+=3;a.form.push('W');h.form.push('L')}else{h.dr++;a.dr++;h.pts++;a.pts++;h.form.push('D');a.form.push('D')}}
  return Object.values(rows).sort((x,y)=>y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf||C(y.id).rep-C(x.id).rep);
}
function posOf(cid){const d=C(cid).div;return table(d).findIndex(r=>r.id===cid)+1}
function expectedPos(c){const ids=divClubs(c.div).sort((a,b)=>C(b).rep-C(a).rep);return ids.indexOf(c.id)+1}
function expText(c){const e=expectedPos(c);if(c.div>0&&e<=2)return 'promotion';if(c.div===0&&e<=2)return 'a title challenge';if(e<=4)return 'a top-four finish';if(e<=8)return 'a mid-table finish';return 'survival'}

/* ---------- match engine ---------- */
class Match{
  constructor(h,a,cup=false,userSide=-1){
    this.c=[h,a];this.cup=cup;this.min=0;this.done=false;this.score=[0,0];this.log=[];this.st={pos:[0,0],sh:[0,0],ot:[0,0],yc:[0,0],rc:[0,0],cor:[0,0]};
    this.us=userSide;this.fit={};this.rate={};this.goals=[];this.inj={};this.reds={};this.yel={};this.played=[];this.lastPoss=0;this.pens=null;this.lastEv=[];
    this.s=[0,1].map(i=>this.mkSide(this.c[i],i));
    this.att=attendance(C(h),C(a),cup);
  }
  mkSide(cid,i){
    const c=C(cid);if(cid!==S.user||!c.lineup)autoPick(c);else ensureLineup(c);
    const sl=slots(c.tac.form);const on=[];
    c.lineup.forEach((id,k)=>{if(id!=null){on.push({id,pos:sl[k].pos,slot:k});this.fit[id]=P(id).fit;this.rate[id]=6.3;this.played.push(id)}});
    return {cid,on,bench:benchOf(c),subs:0,ment:c.tac.ment,press:c.tac.press,form:c.tac.form,user:cid===S.user,bumped:false};
  }
  rating(i){
    const sd=this.s[i];let def=0,mid=0,att=0,gk=18;const med=1;
    for(const o of sd.on){const p=P(o.id),k=p.sk;const f=this.fit[o.id];const cond=(.62+.38*f/100)*(.9+.2*p.morale/100)*(p.pos===o.pos?1:.9);
      if(o.pos==='GK'){gk=k.gk*cond;continue}
      const d=(k.tk*.55+k.pc*.2+k.pa*.1+k.st*.15)*cond,m=(k.pa*.6+k.st*.25+k.pc*.15)*cond,a=(k.sh*.55+k.pc*.3+k.pa*.15)*cond;
      if(o.pos==='DF'){def+=d;mid+=.35*m;att+=.1*a}else if(o.pos==='MF'){def+=.35*d;mid+=m;att+=.4*a}else{def+=.1*d;mid+=.35*m;att+=a}}
    return {def:Math.max(def,40),mid:Math.max(mid,40),att:Math.max(att,20),gk};
  }
  nm(id){return P(id).ln}
  push(ev){this.log.push(ev);this.lastEv.push(ev)}
  step(){
    if(this.done)return [];this.lastEv=[];this.min++;const m=this.min;
    if(m===1)this.push({m,k:'key',t:`Kick-off at ${C(this.c[0]).ground}. ${int(this.att)} in the ground.`});
    const r=[this.rating(0),this.rating(1)];r[0].att*=1.05;r[0].mid*=1.03;
    const mH=r[0].mid*PRESS_MID[this.s[0].press]*(1+.015*(this.s[0].ment-2)),mA=r[1].mid*PRESS_MID[this.s[1].press]*(1+.015*(this.s[1].ment-2));
    const pH=Math.pow(mH,1.6)/(Math.pow(mH,1.6)+Math.pow(mA,1.6));
    const t=R()<pH?0:1,o=1-t;this.lastPoss=t;this.st.pos[t]++;
    const ratio=r[t].att/(r[o].def*.714);
    const q=.205*Math.pow(ratio,1.4)*MENT_ATT[this.s[t].ment]*MENT_CONC[this.s[o].ment];
    if(R()<q)this.shot(t,r[o].gk);
    for(const sd of this.s)for(const on of sd.on){const p=P(on.id);this.fit[on.id]=Math.max(20,this.fit[on.id]-(.09+(100-p.sk.st)/100*.17)*PRESS_FAT[sd.press])}
    if(R()<.034)this.card(R()<.5?0:1);
    if(R()<.0036){const si=R()<.5?0:1;const c=C(this.s[si].cid);if(R()>c.fac.medical*.08)this.injury(si)}
    for(let i=0;i<2;i++){const sd=this.s[i];if(!sd.user||S.autoSub)this.aiSubs(i)}
    for(let i=0;i<2;i++){const sd=this.s[i];if(sd.user)continue;const diff=this.score[i]-this.score[1-i];if(m>=68&&diff<0&&!sd.bumped){sd.ment=Math.min(4,sd.ment+1);sd.bumped=true}if(m>=80&&diff===1&&sd.ment>1){sd.ment=1}}
    if(m===45)this.push({m,k:'key',t:`Half-time. ${C(this.c[0]).name} ${this.score[0]}–${this.score[1]} ${C(this.c[1]).name}.`});
    if(m>=90){
      if(this.cup&&this.score[0]===this.score[1])this.penalties();
      const w=this.winner();this.push({m:90,k:'key',t:`Full-time: ${C(this.c[0]).name} ${this.score[0]}–${this.score[1]} ${C(this.c[1]).name}${this.pens?` (${this.pens[0]}–${this.pens[1]} on penalties)`:''}.`});
      this.done=true;
    }
    return this.lastEv;
  }
  winner(){if(this.score[0]!==this.score[1])return this.score[0]>this.score[1]?0:1;if(this.pens)return this.pens[0]>this.pens[1]?0:1;return -1}
  pickW(arr,fn){let tot=0;const w=arr.map(x=>{const v=Math.max(.01,fn(x));tot+=v;return v});let r=R()*tot;for(let i=0;i<arr.length;i++){r-=w[i];if(r<=0)return arr[i]}return arr[arr.length-1]}
  shot(t,gk){
    const sd=this.s[t];const outf=sd.on.filter(o=>o.pos!=='GK');if(!outf.length)return;
    const sh=this.pickW(outf,o=>{const p=P(o.id);return p.sk.sh*(o.pos==='FW'?3:o.pos==='MF'?1.25:.35)});
    const p=P(sh.id);const fitf=.75+.25*this.fit[sh.id]/100;const big=R()<.17;
    this.st.sh[t]++;const tn=C(sd.cid).name;
    const onT=clamp(.26+p.sk.sh/260+(big?.15:0),.3,.75);
    const ev={m:this.min,side:t,pid:sh.id,shot:true,y:.5};
    if(R()<onT){
      this.st.ot[t]++;
      const g=clamp(.24*Math.pow(p.sk.sh*fitf/Math.max(15,gk),1.25)*(big?2:1),.06,.7);
      if(R()<g){
        this.score[t]++;this.rate[sh.id]+=1.1;ev.res='goal';ev.k='goal';
        let ast=null;const mates=outf.filter(o=>o.id!==sh.id);if(mates.length&&R()<.72){ast=this.pickW(mates,o=>P(o.id).sk.pa*(o.pos==='MF'?1.6:o.pos==='FW'?1.2:.6)).id;this.rate[ast]+=.6}
        this.goals.push({m:this.min,side:t,pid:sh.id,ast});
        const opp=this.s[1-t].on;for(const o of opp){if(o.pos==='GK')this.rate[o.id]-=.35;else if(o.pos==='DF')this.rate[o.id]-=.12}
        ev.t=pick([`GOAL! ${this.nm(sh.id)} finishes it for ${tn}!`,`GOAL! ${this.nm(sh.id)} picks out the corner — ${tn} score!`,`GOAL! ${big?'A clear chance and ':''}${this.nm(sh.id)} makes no mistake.`,`GOAL! ${this.nm(sh.id)} lashes it in!`])+(ast?` Assist: ${this.nm(ast)}.`:'')+` (${this.score[0]}–${this.score[1]})`;
      }else{
        ev.res='save';const kg=this.s[1-t].on.find(o=>o.pos==='GK');if(kg)this.rate[kg.id]+=.2;
        ev.t=pick([`${this.nm(sh.id)} forces a save${kg?' from '+this.nm(kg.id):''}.`,`Good stop! ${this.nm(sh.id)} is denied.`,`${this.nm(sh.id)} tests the keeper, who holds on.`]);
        if(R()<.3){this.st.cor[t]++;ev.t+=' Corner.'}
      }
    }else{ev.res='miss';ev.t=pick([`${this.nm(sh.id)} fires wide.`,`${this.nm(sh.id)} drags a shot past the post.`,`Over the bar from ${this.nm(sh.id)}.`,`${this.nm(sh.id)} snatches at it and misses.`]);if(big)ev.t=`Huge chance! `+ev.t}
    this.push(ev);
  }
  card(si){
    const sd=this.s[si];if(!sd.on.length)return;const o=this.pickW(sd.on,o=>o.pos==='GK'?.15:(P(o.id).sk.tk+20)*(o.pos==='FW'?.6:1));
    const straight=R()<.05;const nm=this.nm(o.id);
    if(straight||this.yel[o.id]){this.reds[o.id]=straight?2:1;this.st.rc[si]++;this.rate[o.id]-=1.5;sd.on=sd.on.filter(x=>x!==o);this.push({m:this.min,k:'card-r',side:si,t:straight?`Red card! ${nm} is sent off for a reckless challenge.`:`Second yellow for ${nm} — off!`});
      if(o.pos==='GK'&&sd.subs<5){const gk=sd.bench.find(id=>P(id).pos==='GK');const out=sd.on.filter(x=>x.pos!=='GK').sort((a,b)=>ovr(P(a.id))-ovr(P(b.id)))[0];if(gk&&out)this.doSub(si,out.id,gk,true)}}
    else{this.yel[o.id]=1;this.st.yc[si]++;this.rate[o.id]-=.3;this.push({m:this.min,k:'card-y',side:si,t:`Yellow card for ${nm}.`})}
  }
  injury(si){
    const sd=this.s[si];if(!sd.on.length)return;const o=pick(sd.on);const c=C(sd.cid);
    const wk=Math.max(1,Math.round(ri(1,7)*(1-.15*c.fac.medical)));this.inj[o.id]=wk;
    this.push({m:this.min,k:'key',side:si,t:`${this.nm(o.id)} is down injured${wk>3?' and it looks serious':''}.`});
    if(sd.subs<5){const rep=this.bestBench(si,o.pos);if(rep!=null){this.doSub(si,o.id,rep,true);return}}
    sd.on=sd.on.filter(x=>x!==o);
  }
  bestBench(si,pos){const sd=this.s[si];let best=null,bv=-1;for(const id of sd.bench){const p=P(id);if((pos==='GK')!==(p.pos==='GK'))continue;const v=ovrAt(p,pos)*(p.pos===pos?1:.9);if(v>bv){bv=v;best=id}}return best}
  doSub(si,outId,inId,forced){
    const sd=this.s[si];const o=sd.on.find(x=>x.id===outId);if(!o||sd.subs>=5)return false;if(!sd.bench.includes(inId))return false;
    sd.bench=sd.bench.filter(x=>x!==inId);sd.subs++;
    const np={id:inId,pos:o.pos,slot:o.slot};sd.on=sd.on.map(x=>x===o?np:x);
    this.fit[inId]=P(inId).fit;this.rate[inId]=6.3;if(!this.played.includes(inId))this.played.push(inId);
    this.push({m:this.min,k:'sub',side:si,t:`Substitution, ${C(sd.cid).name}: ${this.nm(inId)} replaces ${this.nm(outId)}${forced?'':'.'}`});
    return true;
  }
  aiSubs(si){
    const sd=this.s[si];if(sd.subs>=3&&!sd.user)return;if(sd.subs>=5)return;if(this.min<56||this.min>84)return;if(R()>.18)return;
    const tired=sd.on.filter(o=>this.fit[o.id]<74&&o.pos!=='GK').sort((a,b)=>this.fit[a.id]-this.fit[b.id])[0];if(!tired)return;
    const rep=this.bestBench(si,tired.pos);if(rep==null)return;
    if(ovrAt(P(rep),tired.pos)<ovrAt(P(tired.id),tired.pos)-14)return;
    this.doSub(si,tired.id,rep);
  }
  penalties(){
    const kick=si=>{const sd=this.s[si];const gk=this.s[1-si].on.find(o=>o.pos==='GK');const g=gk?P(gk.id).sk.gk:20;const tk=sd.on.length?P(pick(sd.on).id).sk.sh:40;return R()<clamp(.72+(tk-g)/300,.55,.9)};
    let a=0,b=0;for(let i=0;i<5;i++){if(kick(0))a++;if(kick(1))b++}let n=0;while(a===b&&n<20){const x=kick(0),y=kick(1);a+=x;b+=y;n++}if(a===b)a++;
    this.pens=[a,b];
  }
  runAll(){while(!this.done)this.step()}
}

/* finalize a finished match into the season */
function finalize(m){
  const [h,a]=m.c;const res={h,a,hg:m.score[0],ag:m.score[1],pens:m.pens,goals:m.goals.map(g=>({m:g.m,side:g.side,pid:g.pid})),motm:null};
  const w=m.winner();
  // suspensions served by those who sat out
  for(const cid of m.c){for(const id of C(cid).squad){const p=P(id);if(p.sus>0&&!m.played.includes(id))p.sus--}}
  let best=-1;
  for(const id of m.played){
    const p=P(id);if(!p)continue;const si=C(m.c[0]).squad.includes(id)?0:1;
    let rt=m.rate[id]+(w===si?.35:w===-1?0:-.35)+(R()-.5)*.8;rt=clamp(rt,3,10);if(rt>best){best=rt;res.motm=id}
    p.apps++;p.capps++;p.rt+=rt;p.fit=Math.round(m.fit[id]);
    p.morale=clamp(p.morale+(w===si?6:w===-1?1:-6)+(rt>=7.5?3:rt<5.5?-3:0),5,100);
    if(m.inj[id]){p.inj=m.inj[id];p.fit=Math.min(p.fit,60)}
    if(m.reds[id])p.sus=m.reds[id];else if(m.yel[id]){p.yc++;if(p.yc>=5){p.sus=1;p.yc=0;if(p.club===S.user)news(`${pname(p)} has collected five yellow cards and is suspended for the next match.`,'bad')}}
  }
  for(const g of m.goals){const p=P(g.pid);if(p){p.gs++;p.cg++}if(g.ast){const q=P(g.ast);if(q)q.as++}}
  for(let i=0;i<2;i++){const c=C(m.c[i]);const r=w===i?'W':w===-1?'D':'L';c.form.push(r);if(c.form.length>6)c.form.shift()}
  return res;
}

/* ---------- attendance & money ---------- */
function stadiumCap(c){return c.stands.reduce((s,st,i)=>s+effCap(c,i),0)}
function effCap(c,i){const b=c===UC()?S.builds.find(x=>x.stand===i&&x.kind!=='boxes'):null;return Math.round(c.stands[i].cap*(b?.7:1))}
function seatShare(c){const t=c.stands.reduce((s,x)=>s+x.cap,0);return c.stands.reduce((s,x)=>s+(x.seated?x.cap:0),0)/t}
function roofShare(c){const t=c.stands.reduce((s,x)=>s+x.cap,0);return c.stands.reduce((s,x)=>s+(x.roof?x.cap:0),0)/t}
function idealPrice(c){return IDEAL[c.div]*(1+.3*seatShare(c))*(1+.04*c.fac.screen)}
function demand(c,opp,cup,price=c.price){
  const f=c.form.slice(-5);const pts=f.reduce((s,r)=>s+(r==='W'?3:r==='D'?1:0),0);const ff=f.length?.8+.4*pts/(3*f.length):1;
  const pf=clamp(1.45-.45*price/idealPrice(c),.08,1.35);
  const of=opp?clamp(Math.pow(opp.rep/c.rep,.3),.85,1.3):1;
  return c.fans*ff*pf*of*(1+.04*c.fac.parking)*(1+.06*roofShare(c))*(1+.03*c.fac.screen)*(cup?1.08:1);
}
function attendance(c,opp,cup){return Math.round(Math.min(stadiumCap(c),demand(c,opp,cup)*(.95+R()*.1)))}
function boxesOf(c){return c.stands.reduce((s,x)=>s+x.boxes,0)}
function wageBill(c){return c.squad.reduce((s,id)=>s+P(id).wage,0)}
function maintOf(c){return Math.round(c.stands.reduce((s,x)=>s+x.cap,0)*.9+Object.values(c.fac).reduce((s,l)=>s+l,0)*3500)}
function overdraft(c){return Math.round(c.rep*15000/10000)*10000}
function loanLimit(c){return Math.round(c.rep*c.rep*600/50000)*50000}

/* ---------- news ---------- */
function news(t,k='info',extra){S.news.unshift(Object.assign({w:`S${S.season} W${Math.min(S.week+1,CAL.length)}`,t,k},extra||{}));if(S.news.length>70)S.news.length=70}

/* ---------- transfers ---------- */
function askingPrice(p){
  if(p.club<0)return 0;const c=C(p.club);let f=p.listed?.9:1.25;
  const xi=c.squad.map(P).sort((a,b)=>ovr(b)-ovr(a)).slice(0,11).map(x=>x.id);if(xi.includes(p.id))f*=1.25;if(c.squad.length<=18)f*=1.5;
  return Math.round(value(p)*f/5000)*5000;
}
function wageDemand(p,u){const from=p.club>=0?C(p.club).rep:u.rep-5;return Math.round(wageFor(p)*(1+clamp((from-u.rep)/80,-.2,.6))*(p.club<0?1.1:1.05)/50)*50}
function moveP(pid,to,fee,wage,years){
  const p=P(pid);const from=p.club;
  if(from>=0){const fc=C(from);fc.squad=fc.squad.filter(x=>x!==pid);if(fc.lineup)fc.lineup=fc.lineup.map(x=>x===pid?null:x);fc.cash+=fee;if(from===S.user)S.ledger.sales+=fee}
  else S.free=S.free.filter(x=>x!==pid);
  S.offers=S.offers.filter(o=>o.pid!==pid);
  if(to>=0){const tc=C(to);tc.squad.push(pid);tc.cash-=fee;if(to===S.user)S.ledger.purchases+=fee}else S.free.push(pid);
  p.club=to;p.listed=false;p.wage=wage!=null?wage:Math.max(p.wage,wageFor(p));p.contract=years!=null?years:ri(2,4);p.morale=72;
}
function tryBid(pid,fee,wage,years){
  const p=P(pid),u=UC();const seller=p.club>=0?C(p.club):null;
  if(u.squad.length>=30)return {ok:false,msg:'Your squad is full (30 players). Sell or release someone first.'};
  if(fee>u.cash+overdraft(u))return {ok:false,msg:`You can't fund ${money(fee)}. Balance plus overdraft is ${money(u.cash+overdraft(u))}.`};
  if(seller){const ask=askingPrice(p);if(fee<ask*.97){const cnt=Math.round((ask*(1+R()*.05))/5000)*5000;return {ok:false,counter:cnt,msg:`${seller.name} reject the bid. They would accept ${money(cnt)}.`}}}
  const dem=wageDemand(p,u);
  if(wage<dem*.95)return {ok:false,wage:dem,msg:`${p.ln} turns down the contract and asks for ${money(dem)} a week.`};
  const gap=(seller?seller.rep:u.rep)-u.rep;
  if(gap>18&&wage<dem*1.4&&!p.listed)return {ok:false,wage:Math.round(dem*1.45/50)*50,msg:`${p.ln} isn't keen on dropping to a club of your size. A wage of ${money(Math.round(dem*1.45/50)*50)} a week might change that.`};
  moveP(pid,S.user,fee,wage,years);
  news(`${pname(p)} signs for ${u.name}${seller?` from ${seller.name} for ${money(fee)}`:' on a free transfer'}. Wage ${money(wage)}/wk, ${years} year${years>1?'s':''}.`,'good');
  save();return {ok:true,msg:`Deal done. ${pname(p)} joins ${u.name}.`};
}
function weeklyOffers(){
  const u=UC();S.offers=S.offers.filter(o=>o.exp>=S.week&&P(o.pid)&&P(o.pid).club===S.user);
  if(S.offers.length>=6)return;
  const avgU=squadAvg(u);
  for(const id of u.squad){
    const p=P(id);const o=ovr(p);const prob=p.listed?.33:(o>=avgU+5?.045:.008);
    if(R()>=prob||S.offers.some(x=>x.pid===id))continue;
    const v=value(p);
    const buyers=S.clubs.filter(c=>c.id!==S.user&&c.cash>v*.8&&squadAvg(c)<o+6&&c.squad.length<28);
    if(!buyers.length)continue;const b=pick(buyers);
    const amount=Math.round(v*(p.listed?.72+R()*.4:1.05+R()*.45)/5000)*5000;
    S.offers.push({id:S.oid++,pid:id,from:b.id,amount,exp:S.week+2});
    news(`${b.name} bid ${money(amount)} for ${pname(p)}.`,'offer',{offer:S.oid-1});
  }
}
function acceptOffer(oid){
  const o=S.offers.find(x=>x.id===oid);if(!o)return toast('That offer has expired.');
  const p=P(o.pid),b=C(o.from);if(p.club!==S.user)return;
  if(UC().squad.length<=16)return toast('You need at least 16 players. Sign someone before selling.');
  moveP(o.pid,o.from,o.amount);news(`${pname(p)} joins ${b.name} for ${money(o.amount)}.`,'good');S.offers=S.offers.filter(x=>x.id!==oid);save();render();toast(`Sold ${pname(p)} for ${money(o.amount)}`);
}
function rejectOffer(oid){S.offers=S.offers.filter(x=>x.id!==oid);S.news.forEach(n=>{if(n.offer===oid)n.offer=null});save();render()}
function aiMarket(){
  for(let k=0;k<3;k++){
    const c=pick(S.clubs);if(c.id===S.user)continue;
    if(c.squad.length<19&&S.free.length){const best=S.free.map(P).filter(p=>p.wage<c.cash/20+2000).sort((a,b)=>ovr(b)-ovr(a))[0];if(best){moveP(best.id,c.id,0,wageFor(best));continue}}
    if(c.squad.length>27){const worst=c.squad.map(P).sort((a,b)=>ovr(a)-ovr(b))[0];moveP(worst.id,-1,0);continue}
    if(R()<.3&&c.squad.length<27){
      const pos=pick(['DF','MF','FW','DF','MF']);const mine=c.squad.map(P).filter(p=>p.pos===pos).map(ovr).sort((a,b)=>b-a);const ref=mine[2]||40;
      const pool=Object.values(S.players).filter(p=>p.pos===pos&&p.club!==c.id&&p.club!==S.user&&(p.club<0||C(p.club).rep<=c.rep+4)&&ovr(p)>ref+2);
      const cand=shuffle(pool).find(p=>{const f=p.club<0?0:askingPrice(p);return f<=c.cash*.55});
      if(cand){const f=cand.club<0?0:askingPrice(cand);const from=cand.club>=0?C(cand.club):null;if(from&&from.squad.length<=17)continue;moveP(cand.id,c.id,f,wageFor(cand));if(ovr(cand)>=64||c.div===UC().div)news(`${pname(cand)} moves ${from?'from '+from.name+' ':''}to ${c.name}${f?' for '+money(f):' on a free'}.`)}
    }
  }
}

/* ---------- weekly cycle ---------- */
function finishWeek(userMatch){
  const fx=weekFixtures();const ev=CAL[S.week];const out=[];
  const u=UC();const fin={tickets:0,boxes:0,shop:0,food:0,tv:0,sponsor:0,bonus:0,wages:0,maint:0,interest:0,build:0,att:0};
  for(const f of fx){
    let m;if(userMatch&&(f.h===S.user||f.a===S.user))m=userMatch;else{m=new Match(f.h,f.a,f.cup);m.runAll()}
    const res=finalize(m);res.att=m.att;out.push(Object.assign({},f,res));
    if(!f.cup)S.res[f.div].push({r:f.r,h:f.h,a:f.a,hg:res.hg,ag:res.ag});
    else S.cup.ties[f.tie].res={hg:res.hg,ag:res.ag,pens:res.pens,w:m.winner()===0?f.h:f.a};
    // gate money
    const hc=C(f.h);const gate=m.att*hc.price;const box=boxesOf(hc)*2500;const shop=m.att*2*hc.fac.shop;const food=m.att*1.5*hc.fac.food;
    if(f.cup){const ac=C(f.a);ac.cash+=Math.round(gate*.3);hc.cash+=Math.round(gate*.7)+box+shop+food;if(f.h===S.user){fin.tickets+=Math.round(gate*.7);fin.boxes+=box;fin.shop+=shop;fin.food+=food;fin.att=m.att}if(f.a===S.user)fin.tickets+=Math.round(gate*.3)}
    else{hc.cash+=gate+box+shop+food;if(f.h===S.user){fin.tickets+=gate;fin.boxes+=box;fin.shop+=shop;fin.food+=food;fin.att=m.att}}
    const wi=m.winner();
    if(S.sponsor&&wi>=0&&m.c[wi]===S.user){fin.bonus+=S.sponsor.win}
    if(!f.cup&&(f.h===S.user||f.a===S.user))boardAfterMatch(wi===-1?'D':m.c[wi]===S.user?'W':'L');
  }
  if(ev[0]==='C'&&S.cup.ties){const cu=S.cup;const winners=cu.ties.map(t=>t.res.w);cu.log.push({name:cu.names[cu.round],ties:cu.ties,byes:cu.byes||[]});
    if(cu.ties.some(t=>(t.h===S.user||t.a===S.user)&&t.res.w!==S.user))news(`${u.name} are out of the Crown Cup (${cu.names[cu.round]}).`,'bad');
    cu.alive=winners.concat(cu.byes||[]);cu.ties=null;cu.byes=[];cu.round++;
    if(cu.alive.length===1){cu.winner=cu.alive[0];const f=cu.log[cu.log.length-1].ties[0];cu.runnerUp=f.h===cu.winner?f.a:f.h;news(`${C(cu.winner).name} win the Crown Cup!`,cu.winner===S.user?'good':'info')}}
  // weekly money for every club
  for(const c of S.clubs){
    const tv=TV[c.div];const wages=wageBill(c);const maint=maintOf(c);
    const spons=c.id===S.user?(S.sponsor?S.sponsor.weekly:0):Math.round(c.rep*c.rep*SPF[c.div]);
    c.cash+=tv+spons-wages-maint;
    if(c.id===S.user){fin.tv=tv;fin.sponsor=spons;fin.wages=wages;fin.maint=maint;c.cash+=fin.bonus;
      const intr=Math.round(S.loan*.0025);fin.interest=intr;c.cash-=intr;}
  }
  // builds
  for(const b of S.builds){b.left--;if(b.left<=0)completeBuild(b)}S.builds=S.builds.filter(b=>b.left>0);
  // ledger
  for(const k in fin)if(k in S.ledger)S.ledger[k]+=fin[k];S.lastFin=fin;
  // training, fitness, injuries, morale
  for(const c of S.clubs){const tr=c.id===S.user?S.train:{focus:'balanced',inten:1};trainClub(c,tr.focus,tr.inten)}
  for(const id of S.free){const p=P(id);if(p.inj>0)p.inj--;p.fit=Math.min(100,p.fit+25)}
  weeklyOffers();aiMarket();
  if(u.cash<-overdraft(u)){S.board.conf=clamp(S.board.conf-3,0,100);news(`The bank is worried: you are ${money(-u.cash)} overdrawn, past your ${money(overdraft(u))} limit. The board's patience is shrinking.`,'bad')}
  S.board.conf=clamp(S.board.conf,0,100);
  S.lastWeek={label:weekLabel(),results:out,ev};
  S.week++;S.balHist.push(u.cash);
  if(S.board.conf<=4&&!S.sacked){S.sacked=true;news(`The board has lost confidence in ${S.manager}.`,'bad')}
  if(S.week>=CAL.length)endSeason();
  save();
}
function boardAfterMatch(r){
  const u=UC();const exp=expectedPos(u);const pos=posOf(S.user);
  const played=S.res[u.div].filter(m=>m.h===S.user||m.a===S.user).length;
  S.board.conf=clamp(S.board.conf+(r==='W'?2.2:r==='D'?.3:-2.3)+(played>=6?clamp((exp-pos)*.1,-.7,.7):0),0,100);
}
function pickSkill(p,focus){
  if(p.pos==='GK'&&R()<.65)return 'gk';
  const map={attack:['sh','sh','pc'],defence:['tk','tk','pc'],passing:['pa','pa','st'],fitness:['st','st','pc']};

  // reputation & board
  for(const c of S.clubs){const t=tables[c.div];const pos=t.findIndex(r=>r.id===c.id)+1;const exp=expectedPos(c);c._pos=pos;c._delta=(exp-pos)}
  const exp=expectedPos(u);
  let conf=S.board.conf+(exp-upos)*2.5+(S.season===1?8:0);
  // promotion/relegation
  const moves=[];
  for(let d=0;d<2;d++){const t1=tables[d],t2=tables[d+1];const down=t1.slice(-2).map(r=>r.id),up=t2.slice(0,2).map(r=>r.id);moves.push([down,d+1],[up,d]);rev.releg.push(...down.map(id=>({id,from:d})));rev.prom.push(...up.map(id=>({id,from:d+1})))}

  if(uPromoted)conf+=22;if(uRelegated)conf-=exp>=11?10:28;if(S.cup.winner===S.user)conf+=12;if(tables[udiv][0].id===S.user)conf+=15;
  if(u.cash<0)conf-=6;

    c.rep=clamp(Math.round(c.rep+c._delta*1.1+(pr?5:0)-(rl?5:0)+(c._pos===1?3:0)+(c.id===S.cup.winner?2:0)),12,97);
    c.fans=Math.round(c.fans*(1+clamp(c._delta*.012+(pr?.08:0)-(rl?.07:0)+.01*c.fac.screen,-.12,.18)));
    delete c._pos;delete c._delta;c.form=[];
    if(c.id!==S.user){c.price=Math.round(IDEAL[c.div]*1.25);if(c.cash>4e6&&stadiumCap(c)<c.fans*1.05){const i=ri(0,3);if(c.stands[i].cap+2000<=STANDMAX[i]){c.stands[i].cap+=2000;c.cash-=900000}}}
  }
  S.history.push({season:S.season,year:S.year,club:u.name,div:udiv,pos:upos,cup:S.cup.winner===S.user?'Winners':S.cup.runnerUp===S.user?'Runners-up':cupExit(),prom:uPromoted,rel:uRelegated,champ:C(tables[0][0].id).name,cupw:S.cup.winner!=null?C(S.cup.winner).name:'—'});
  // players: aging, contracts, retirements

    p.age++;p.contract--;p.gs=0;p.as=0;p.apps=0;p.rt=0;p.yc=0;p.sus=0;p.fit=100;p.morale=68;p.listed=p.club===S.user?p.listed:false;p.inj=Math.max(0,p.inj-4);

    if(p.club>=0&&p.contract<=0){

    for(let k=0;k<n;k++){const pos=pick(['GK','DF','DF','MF','MF','FW','FW']);const p=makePlayer(pos,26+c.rep*.24+y*4+gauss()*4,ri(16,17));p.pot=clamp(ovr(p)+ri(12,26+y*6),ovr(p),95);p.contract=3;p.wage=300;p.club=c.id;S.players[p.id]=p;c.squad.push(p.id);if(c.id===S.user)youthNames.push(`${pname(p)} (${p.pos}, ${starsOf(p)}★ potential)`)}}
  if(youthNames.length)news(`Academy graduates join the squad: ${youthNames.join('; ')}.`,'good');
  { const emerg=[];const needPos=()=>{const n=k=>u.squad.filter(id=>P(id).pos===k).length;return n('GK')<2?'GK':n('DF')<5?'DF':n('MF')<5?'MF':'FW'};

  // AI squads: keep 20–27

const AU={ctx:null,amb:null};
function auInit(){if(AU.ctx)return;try{AU.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AU.ctx=null}}
function noiseBuf(sec){const c=AU.ctx;const b=c.createBuffer(1,c.sampleRate*sec,c.sampleRate);const d=b.getChannelData(0);let last=0;for(let i=0;i<d.length;i++){const w=R()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.5}return b}
function ambient(on){if(!AU.ctx)return;if(on&&!AU.amb){const s=AU.ctx.createBufferSource();s.buffer=noiseBuf(4);s.loop=true;const f=AU.ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=600;f.Q.value=.6;const g=AU.ctx.createGain();g.gain.value=.05;s.connect(f).connect(g).connect(AU.ctx.destination);s.start();AU.amb={s,g}}else if(!on&&AU.amb){try{AU.amb.s.stop()}catch(e){}AU.amb=null}}
function roar(level=1){if(!UI.sound||!AU.ctx)return;const c=AU.ctx;const s=c.createBufferSource();s.buffer=noiseBuf(3);const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=1400;const g=c.createGain();const t=c.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.55*level,t+.25);g.gain.exponentialRampToValueAtTime(.001,t+2.8);s.connect(f).connect(g).connect(c.destination);s.start()}
function whistle(n=1){if(!UI.sound||!AU.ctx)return;const c=AU.ctx;for(let i=0;i<n;i++){const t=c.currentTime+i*.42;const o=c.createOscillator();o.frequency.value=2900;const l=c.createOscillator();l.frequency.value=38;const lg=c.createGain();lg.gain.value=180;l.connect(lg).connect(o.frequency);const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.02);g.gain.setValueAtTime(.12,t+(i===n-1?.55:.28));g.gain.linearRampToValueAtTime(0,t+(i===n-1?.62:.33));o.connect(g).connect(c.destination);o.start(t);l.start(t);o.stop(t+.7);l.stop(t+.7)}}

    </div>

/* ---------- squad ---------- */

   </tbody></table></div>

  </div>`;
}
function statusChips(p){const c=[];if(p.inj>0)c.push(`<span class="chip bad">Inj ${p.inj}w</span>`);if(p.sus>0)c.push(`<span class="chip warn">Ban ${p.sus}</span>`);if(p.listed)c.push(`<span class="chip amber">Listed</span>`);if(p.contract<=1&&p.club>=0)c.push(`<span class="chip">Expiring</span>`);if(p.age<=19&&p.pot-ovr(p)>=15)c.push(`<span class="chip good">Prospect</span>`);return c.join(' ')}

function drawStadium(cv,c){
  if(!cv)return;const dpr=Math.min(2,window.devicePixelRatio||1);const W=cv.clientWidth||900;const H=Math.round(W*2/3);cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';const g=cv.getContext('2d');g.scale(dpr,dpr);
  // ground
  g.fillStyle='#0f1d18';g.fillRect(0,0,W,H);
  // surrounding streets / car park
  const cx=W/2,cy=H/2;const pw=W*.40,ph=pw*.64;const maxD=Math.min(W*.13,H*.16);
  g.fillStyle='#16251f';g.fillRect(W*.04,H*.05,W*.92,H*.9);
  // car park (bottom-left)
  const pk=c.fac.parking;
  g.fillStyle='#202c28';g.fillRect(W*.05,H*.70,W*.17,H*.23);
  g.strokeStyle='rgba(255,255,255,.12)';g.lineWidth=1;for(let i=0;i<8;i++){g.beginPath();g.moveTo(W*.05+i*W*.021,H*.70);g.lineTo(W*.05+i*W*.021,H*.76);g.stroke()}
  const carCols=['#c84','#48c','#ddd','#a33','#3a6','#999'];let cars=pk*14+3;for(let i=0;i<cars&&i<44;i++){g.fillStyle=carCols[i%6];g.fillRect(W*.055+(i%11)*W*.0145,H*.705+Math.floor(i/11)*H*.055,W*.009,H*.035)}
  label(g,'Car park',W*.135,H*.955);
  // training ground (top-right)
  const tr=c.fac.training;for(let i=0;i<Math.max(1,tr);i++){const x=W*.80,y=H*.08+i*H*.13;g.fillStyle=tr?'#24603d':'#2a3a2f';g.fillRect(x,y,W*.15,H*.11);g.strokeStyle='rgba(255,255,255,.4)';g.strokeRect(x+3,y+3,W*.15-6,H*.11-6);g.beginPath();g.moveTo(x+W*.075,y+3);g.lineTo(x+W*.075,y+H*.11-3);g.stroke()}
  label(g,'Training ground',W*.875,H*.08+Math.max(1,tr)*H*.13+12);
  // academy (top-left)
  g.fillStyle=c.fac.youth?'#3c4f47':'#25332d';g.fillRect(W*.06,H*.08,W*.12,H*.12);g.fillStyle='rgba(255,179,64,.25)';for(let i=0;i<c.fac.youth;i++)g.fillRect(W*.07+i*W*.035,H*.1,W*.025,H*.03);label(g,'Academy',W*.12,H*.235);
  // medical (bottom right)
  g.fillStyle=c.fac.medical?'#46525a':'#25332d';g.fillRect(W*.82,H*.74,W*.11,H*.12);g.fillStyle=c.fac.medical?'#ff7466':'#555';g.fillRect(W*.868,H*.765,W*.014,H*.07);g.fillRect(W*.851,H*.79,W*.048,H*.02);label(g,'Medical',W*.875,H*.9);
  // pitch
  const px=cx-pw/2,py=cy-ph/2;
  for(let i=0;i<10;i++){g.fillStyle=i%2?'#2c7a49':'#2f8150';g.fillRect(px+i*pw/10,py,pw/10,ph)}
  g.strokeStyle='rgba(255,255,255,.8)';g.lineWidth=1.4;g.strokeRect(px+4,py+4,pw-8,ph-8);g.beginPath();g.moveTo(cx,py+4);g.lineTo(cx,py+ph-4);g.stroke();g.beginPath();g.arc(cx,cy,ph*.13,0,7);g.stroke();
  g.strokeRect(px+4,cy-ph*.29,pw*.16,ph*.58);g.strokeRect(px+pw-4-pw*.16,cy-ph*.29,pw*.16,ph*.58);
  // stands: 0 N(top) 1 S(bottom) 2 W(left) 3 E(right)
  const build=i=>S.builds.find(b=>b.stand===i);
  const rects=c.stands.map((st,i)=>{const d=10+maxD*Math.sqrt(st.cap/STANDMAX[i]);const gap=6;
    if(i===0)return {x:px,y:py-gap-d,w:pw,h:d,o:'h',out:-1};if(i===1)return {x:px,y:py+ph+gap,w:pw,h:d,o:'h',out:1};
    if(i===2)return {x:px-gap-d,y:py,w:d,h:ph,o:'v',out:-1};return {x:px+pw+gap,y:py,w:d,h:ph,o:'v',out:1}});
  c.stands.forEach((st,i)=>{const r=rects[i];
    const rows=Math.max(3,Math.round((r.o==='h'?r.h:r.w)/4));
    for(let k=0;k<rows;k++){const t=k/rows;let col;if(st.seated){col=k%2?shade(c.c1,-.18):c.c1;if(k%6===3)col=c.c2}else col=k%2?'#7d8983':'#8f9b95';
      g.fillStyle=col;
      if(r.o==='h'){const yy=r.out<0?r.y+r.h-(k+1)*r.h/rows:r.y+k*r.h/rows;g.fillRect(r.x,yy,r.w,r.h/rows+.5)}else{const xx=r.out<0?r.x+r.w-(k+1)*r.w/rows:r.x+k*r.w/rows;g.fillRect(xx,r.y,r.w/rows+.5,r.h)}}
    if(!st.seated){g.strokeStyle='rgba(30,30,30,.55)';g.lineWidth=1;for(let k=1;k<6;k++){g.beginPath();if(r.o==='h'){const xx=r.x+k*r.w/6;g.moveTo(xx,r.y);g.lineTo(xx,r.y+r.h)}else{const yy=r.y+k*r.h/6;g.moveTo(r.x,yy);g.lineTo(r.x+r.w,yy)}g.stroke()}}
    if(st.boxes){g.fillStyle='#7fd0ff';const n=Math.min(st.boxes,40);const bd=Math.max(4,(r.o==='h'?r.h:r.w)*.12);for(let k=0;k<n;k++){if(r.o==='h'){const bw=r.w/n;g.fillRect(r.x+k*bw+1,r.out<0?r.y:r.y+r.h-bd,bw-2,bd)}else{const bh=r.h/n;g.fillRect(r.out<0?r.x:r.x+r.w-bd,r.y+k*bh+1,bd,bh-2)}}}
    if(st.roof){g.fillStyle='rgba(205,222,232,.42)';const rd=(r.o==='h'?r.h:r.w)*.62;if(r.o==='h')g.fillRect(r.x-4,r.out<0?r.y-3:r.y+r.h-rd+3,r.w+8,rd);else g.fillRect(r.out<0?r.x-3:r.x+r.w-rd+3,r.y-4,rd,r.h+8);
      g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=1;for(let k=0;k<12;k++){g.beginPath();if(r.o==='h'){const xx=r.x+k*r.w/12;g.moveTo(xx,r.out<0?r.y-3:r.y+r.h-rd+3);g.lineTo(xx,r.out<0?r.y-3+rd:r.y+r.h+3)}else{const yy=r.y+k*r.h/12;g.moveTo(r.out<0?r.x-3:r.x+r.w-rd+3,yy);g.lineTo(r.out<0?r.x-3+rd:r.x+r.w+3,yy)}g.stroke()}}
    if(build(i)){g.save();g.beginPath();g.rect(r.x,r.y,r.w,r.h);g.clip();g.strokeStyle='rgba(255,211,107,.85)';g.lineWidth=5;for(let k=-40;k<40;k++){g.beginPath();g.moveTo(r.x+k*16,r.y);g.lineTo(r.x+k*16+r.h+r.w,r.y+r.h+r.w);g.stroke()}g.restore();
      // crane
      const bx=r.x+r.w*.7,by=r.y+r.h*.5;g.strokeStyle='#ffd36b';g.lineWidth=3;g.beginPath();g.moveTo(bx,by);g.lineTo(bx-W*.08,by-H*.06);g.stroke();g.fillStyle='#ffd36b';g.fillRect(bx-4,by-4,8,8)}
    g.fillStyle='rgba(238,241,228,.9)';g.font=`600 ${Math.max(10,W*.014)}px Archivo, sans-serif`;g.textAlign='center';
    const txt=`${STANDS[i]} · ${int(st.cap)}`;
    if(r.o==='h')g.fillText(txt,r.x+r.w/2,r.out<0?r.y-8:r.y+r.h+16);
    else{g.save();g.translate(r.out<0?r.x-8:r.x+r.w+8,r.y+r.h/2);g.rotate(r.out<0?-Math.PI/2:Math.PI/2);g.fillText(txt,0,0);g.restore()}
  });
  // corners: shop & food
  g.font=`700 ${Math.max(10,W*.013)}px Archivo, sans-serif`;
  const cs=maxD*.82;
  const cornerBox=(x,y,lvl,txt)=>{g.fillStyle=lvl?'#ffb340':'#2a3530';g.fillRect(x,y,cs,cs);g.fillStyle=lvl?'#2a1a00':'#9fb5a8';g.textAlign='center';g.font=`700 ${Math.max(9,W*.012)}px Archivo, sans-serif`;g.fillText(txt,x+cs/2,y+cs*.45);g.font=`600 ${Math.max(9,W*.011)}px IBM Plex Mono, monospace`;g.fillText(lvl?'LEVEL '+lvl:'NONE',x+cs/2,y+cs*.72)};
  cornerBox(px-6-cs,py-6-cs,c.fac.shop,'SHOP');
  cornerBox(px+pw+6,py-6-cs,c.fac.food,'BARS');
  // floodlights
  [[px-maxD-22,py-maxD-22],[px+pw+maxD+22,py-maxD-22],[px-maxD-22,py+ph+maxD+22],[px+pw+maxD+22,py+ph+maxD+22]].forEach(([x,y])=>{const gr=g.createRadialGradient(x,y,0,x,y,W*.07);gr.addColorStop(0,'rgba(255,220,150,.35)');gr.addColorStop(1,'rgba(255,220,150,0)');g.fillStyle=gr;g.fillRect(x-W*.07,y-W*.07,W*.14,W*.14);g.fillStyle='#ffe9b8';g.fillRect(x-4,y-4,8,8)});
  if(c.fac.screen){g.fillStyle='#111';g.fillRect(cx-pw*.12,py+ph+maxD+18,pw*.24,H*.035);g.fillStyle='#ffb340';g.font=`700 ${Math.max(9,W*.012)}px IBM Plex Mono, monospace`;g.textAlign='center';g.fillText(c.town.toUpperCase()+' '+(c.form.slice(-1)[0]||''),cx,py+ph+maxD+18+H*.025)}
}
function label(g,t,x,y){g.fillStyle='rgba(159,181,168,.95)';g.font=`600 ${Math.max(10,g.canvas.clientWidth*.013)}px Archivo, sans-serif`;g.textAlign='center';g.fillText(t,x,y)}
function shade(h,a){const [r,g,b]=hexRgb(h);const f=v=>clamp(Math.round(a<0?v*(1+a):v+(255-v)*a),0,255);return `rgb(${f(r)},${f(g)},${f(b)})`}

function balChart(){
  const h=S.balHist.slice(-60);if(h.length<2)return '<p class="dim">The chart fills in as the weeks go by.</p>';
  const W=640,H=180,pl=54,pr=12,pt=12,pb=22;let lo=Math.min(0,...h),hi=Math.max(...h);if(hi-lo<1)hi=lo+1;const pad=(hi-lo)*.08;lo-=pad;hi+=pad;
  const x=i=>pl+i*(W-pl-pr)/(h.length-1),y=v=>pt+(1-(v-lo)/(hi-lo))*(H-pt-pb);
  const ticks=[lo+ (hi-lo)*.1,(lo+hi)/2,hi-(hi-lo)*.1];
  const d=h.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  return `<div class="tw"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:320px;height:auto" role="img" aria-label="Bank balance over the last ${h.length} weeks">
   ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="#264a3d" stroke-dasharray="3 4"/><text x="${pl-6}" y="${y(t)+4}" fill="#6f877b" font-size="11" text-anchor="end" font-family="IBM Plex Mono,monospace">${money(t)}</text>`).join('')}
   ${lo<0&&hi>0?`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="#ff7466" stroke-opacity=".5"/>`:''}
   <path d="${d}L${x(h.length-1)},${H-pb}L${pl},${H-pb}Z" fill="#ffb340" fill-opacity=".10"/>
   <path d="${d}" fill="none" stroke="#ffb340" stroke-width="2.2" stroke-linejoin="round"/>
   <circle cx="${x(h.length-1)}" cy="${y(h[h.length-1])}" r="4.5" fill="#ffb340" stroke="#10281f" stroke-width="2"/>
   <text x="${pl}" y="${H-5}" fill="#6f877b" font-size="11" font-family="Archivo,sans-serif">${h.length} weeks ago</text><text x="${W-pr}" y="${H-5}" fill="#6f877b" font-size="11" text-anchor="end" font-family="Archivo,sans-serif">Now</text>
  </svg></div>`;
}

   <div class="row" style="margin-top:10px"><button class="btn pri" data-act="dosub" ${L.subOut&&L.subIn&&sd.subs<5?'':'disabled'}>Make substitution</button><span class="dim" style="font-size:12px">${sd.subs}/5 used. The match is paused.</span></div>`;

function liveScore(){
  const L=UI.live;const m=L.m;const h=C(m.c[0]),a=C(m.c[1]);const el=$('#sb');if(!el)return;
  el.innerHTML=`<div class="tn">${badge(h,40)}<span>${esc(h.name)}</span></div><div class="sc">${m.score[0]}–${m.score[1]}<span class="mn">${m.done?'FULL-TIME':m.min===0?'KICK-OFF':m.min+"'"}${m.pens?` · PENS ${m.pens[0]}–${m.pens[1]}`:''}</span></div><div class="tn r"><span>${esc(a.name)}</span>${badge(a,40)}</div>`;
  const st=m.st;const tot=Math.max(1,st.pos[0]+st.pos[1]);const ph=Math.round(st.pos[0]/tot*100);
  const line=(n,x,y,suf='')=>{const s=Math.max(1,x+y);return `<div class="stat2" style="margin-bottom:2px"><b class="mono" style="text-align:right">${x}${suf}</b><div class="b"><i style="width:${x/s*100}%;background:${kitCol(0)}"></i><i style="width:${y/s*100}%;background:${kitCol(1)}"></i></div><b class="mono">${y}${suf}</b></div><div class="label" style="text-align:center;margin-bottom:6px">${n}</div>`};
  $('#stats').innerHTML=line('Possession',ph,100-ph,'%')+line('Shots',st.sh[0],st.sh[1])+line('On target',st.ot[0],st.ot[1])+line('Corners',st.cor[0],st.cor[1])+line('Yellow cards',st.yc[0],st.yc[1]);
  $('#attn').textContent='Crowd '+int(m.att);

function kitCol(i){const L=UI.live;const k=kits(L.m.c[0],L.m.c[1]);return k[i].fill}
function liveComm(evs){
  const el=$('#comm');if(!el)return;
  for(const e of evs){const d=document.createElement('div');d.className='c '+(e.k||'');d.innerHTML=`<span class="m">${e.m}'</span><span class="t">${esc(e.t)}</span>`;el.prepend(d)}
}
function mountLive(){
  const L=UI.live;const cv=$('#pitch');L.viz=new Viz(cv,L.m);
  liveScore();liveControls();liveSubs();
  const el=$('#comm');el.innerHTML='';liveComm(L.m.log);
  cancelAnimationFrame(L.raf);L.lastT=performance.now();
  const loop=t=>{if(UI.view!=='live'||UI.live!==L)return;const dt=Math.min(.1,(t-L.lastT)/1000);L.lastT=t;
    if(!L.paused&&!L.m.done&&!L.showSubs){L.acc+=dt*L.speed;const per=.62;while(L.acc>=per&&!L.m.done){L.acc-=per;const evs=L.m.step();L.viz.minute(evs,per/L.speed);liveComm(evs);liveScore();onEvents(evs);if(L.m.done){liveControls();whistle(3);ambient(false)}}}
    L.viz.frame(dt);L.raf=requestAnimationFrame(loop)};
  L.raf=requestAnimationFrame(loop);
}
function onEvents(evs){
  for(const e of evs){if(e.k==='goal'){UI.live.viz.flash(e.side);roar(e.side===UI.live.m.us?1:.5)}if(e.m===45&&e.k==='key'&&/Half-time/.test(e.t))whistle(2)}
}
/* pitch renderer */
class Viz{
  constructor(cv,m){
    this.cv=cv;this.m=m;this.kit=kits(m.c[0],m.c[1]);

      for(const p of this.pl[si]){const o=m.s[si].on.find(x=>x.id===p.id);if(!o)continue;const s=slots(m.s[si].form)[o.slot]||{x:.3,y:.5};
        let tx,ty;if(o.pos==='GK'){tx=.03+(ownBall-.5)*.05;ty=.5+(b.y-.5)*.25}else{tx=s.x*.95+.04+(ownBall-.45)*.38+(poss?.07:-.03);ty=s.y+(b.y-s.y)*.2+Math.sin(this.t*.7+p.id)*.012}

      g.fillStyle=o.pos==='GK'?(si?'#7ee0a8':'#e8d24a'):kt.fill;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.lineWidth=Math.max(1.5,r*.32);g.strokeStyle=o.pos==='GK'?'#1a1a1a':kt.trim;g.stroke()}}

/* ---------- week results & season review ---------- */
function viewWeek(){
  const w=S.lastWeek;if(!w){UI.view='home';return viewHome()}
  const mine=w.results.find(r=>r.h===S.user||r.a===S.user);
  const groups=w.ev[0]==='L'?[0,1,2].map(d=>({n:DIVS[d],r:w.results.filter(x=>x.div===d)})):[{n:'Crown Cup',r:w.results}];
  const line=r=>`<tr class="${r.h===S.user||r.a===S.user?'me':''}"><td style="text-align:right;white-space:normal">${esc(C(r.h).name)}</td><td class="n mono" style="text-align:center;width:70px"><b>${r.hg}–${r.ag}</b>${r.pens?`<div class="faint" style="font-size:11px">${r.pens[0]}–${r.pens[1]} p</div>`:''}</td><td style="white-space:normal">${esc(C(r.a).name)}</td></tr>`;
  let head='';
  if(mine){const us=mine.h===S.user?0:1;const gf=us?mine.ag:mine.hg,ga=us?mine.hg:mine.ag;const won=gf>ga||(gf===ga&&mine.pens&&mine.pens[us]>mine.pens[1-us]);const lost=gf<ga||(gf===ga&&mine.pens&&!won);
    const sc=mine.goals.filter(g=>g.side===us).map(g=>`${P(g.pid)?pname(P(g.pid)):'?'} ${g.m}'`).join(', ');
    head=`<div class="panel" style="margin-bottom:16px"><div class="row"><span class="chip ${won?'good':lost?'bad':''}">${won?'Win':lost?'Defeat':'Draw'}</span><span class="label">${esc(w.label)}</span></div>
     <div class="fixture" style="margin-top:10px"><div class="tm">${badge(C(mine.h),56)}<b>${esc(C(mine.h).name)}</b></div><div class="big amber mono" style="font-size:44px">${mine.hg}–${mine.ag}</div><div class="tm">${badge(C(mine.a),56)}<b>${esc(C(mine.a).name)}</b></div></div>
     <p class="dim" style="text-align:center;margin:10px 0 0">${sc?'Your scorers: '+esc(sc)+' · ':''}Crowd ${int(mine.att)}${mine.motm&&P(mine.motm)?' · Player of the match: '+esc(pname(P(mine.motm))):''}</p></div>`}
  return `${head}<div class="grid g3">${groups.map(g=>`<div class="panel"><div class="panel-h"><h2>${g.n}</h2></div><table class="tbl"><tbody>${g.r.map(line).join('')||'<tr><td class="dim">No matches.</td></tr>'}</tbody></table></div>`).join('')}</div>
  <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn" data-go="league">Tables</button><button class="btn go" data-go="${S.review?'season':'home'}">${S.review?'Season review ▸':'Back to the office ▸'}</button></div>`;
}

/* ---------- actions ---------- */
function onContinue(){
  if(!S||S.sacked)return;
  if(S.review){UI.view='season';render();return}
  const f=userFixture();
  if(f){
    if(!S.sponsor&&S.week===0)toast('Tip: choose a shirt sponsor in Finances. It pays every week.');
    UI.view='pre';render();window.scrollTo(0,0);return;
  }
  finishWeek(null);UI.view='week';render();window.scrollTo(0,0);
}

    case 'golive':startLive();break;
    case 'instant':{const f=userFixture();const m=new Match(f.h,f.a,f.cup,f.h===S.user?0:1);m.runAll();finishWeek(m);UI.view='week';render();window.scrollTo(0,0);break}
    case 'speed':{const L=UI.live;if(v==='pause')L.paused=!L.paused;else{L.paused=false;L.speed=+v}liveControls();break}
    case 'showsubs':{const L=UI.live;L.showSubs=!L.showSubs;L.subIn=L.subOut=null;liveSubs();break}
    case 'subout':UI.live.subOut=+v;liveSubs();break;
    case 'subin':UI.live.subIn=+v;liveSubs();break;
    case 'dosub':{const L=UI.live;if(L.m.doSub(L.m.us,L.subOut,L.subIn)){liveComm(L.m.lastEv.slice(-1));L.viz.sync();L.subOut=L.subIn=null;L.showSubs=false;liveSubs();liveControls()}break}
    case 'skip':{const L=UI.live;while(!L.m.done){const evs=L.m.step();liveComm(evs)}liveScore();liveControls();liveSubs();whistle(3);ambient(false);break}
    case 'sndtoggle':UI.sound=!UI.sound;if(UI.sound){auInit();try{AU.ctx.resume()}catch(err){}if(!UI.live.m.done)ambient(true)}else ambient(false);liveControls();break;
    case 'livedone':{const L=UI.live;cancelAnimationFrame(L.raf);if(L.viz)window.removeEventListener('resize',L.viz._rs);ambient(false);UI.live=null;finishWeek(L.m);UI.view='week';render();window.scrollTo(0,0);break}
    case 'newseason':S.review=null;UI.view='home';save();render();window.scrollTo(0,0);break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target;const a=el.dataset&&el.dataset.act;if(!a||!S)return;const u=S.user>=0?UC():null;
  switch(a){
    case 'form':u.tac.form=el.value;autoPick(u);UI.sel=null;save();render();break;
    case 'mmax':UI.mkt.max=+el.value;render();break;
    case 'mmin':UI.mkt.minO=+el.value;render();break;
    case 'mage':UI.mkt.age=+el.value;render();break;
    case 'msort':UI.mkt.sort=el.value;render();break;
    case 'lment':{const L=UI.live;L.m.s[L.m.us].ment=+el.value;u.tac.ment=+el.value;break}
    case 'price':u.price=+el.value;save();render();break;
  }
});
document.addEventListener('input',e=>{
  const el=e.target;if(el.id!=='price'||!S)return;const u=UC();const p=+el.value;const cap=stadiumCap(u);const est=Math.round(Math.min(cap,demand(u,null,false,p)));
  $('#p-price').textContent='€'+p;$('#p-att').textContent=int(est);$('#p-rev').textContent=money(est*p);$('#p-full').textContent=est>=cap?'sold out':Math.round(est/cap*100)+'% full';
});
document.addEventListener('submit',e=>{
  const f=e.target;if(f.dataset.form!=='bid')return;e.preventDefault();
  const pid=+f.dataset.v;const fee=+($('#bfee').value||0),wage=+($('#bwage').value||0),yrs=+$('#byrs').value;
  const r=tryBid(pid,P(pid).club>=0?fee:0,wage,yrs);const msg=$('#bidmsg');msg.className=r.ok?'good':'warn';msg.textContent=r.msg;
  if(r.counter)$('#bfee').value=r.counter;if(r.wage)$('#bwage').value=r.wage;
  if(r.ok){render();setTimeout(closeModal,900)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
window.addEventListener('resize',()=>{if(UI.view==='stadium'&&S)drawStadium($('#stad'),UC())});

/* ---------- boot ---------- */
function start(data){
  if(data&&data.S&&data.S.v===1){S=data.S;UI.view=data.view&&!['live','pre'].includes(data.view)?data.view:'home'}
  else{const s=load();if(s){S=s;UI.view=S.review?'season':'home'}}
  render();
}
try{window.claude?.hot?.snapshot?.(()=>({S:S&&S.user>=0?S:null,view:UI.view}))}catch(e){}
if(window.claude?.hot?.ready)window.claude.hot.ready(start);else start(window.claude?.hot?.data??{});
</script>
</body>
