<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Freight Empire</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A transport tycoon game: build roads, stops and depots, haul raw materials and goods, and watch the towns grow.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800;900&family=Overpass+Mono:wght@400;600&display=swap">
<style>
/* Layout: the isometric map fills the screen; a dispatch bar on top, a tool rail on the left (bottom on phones), an inspector on the right (bottom sheet on phones). */
:root{
  --bg:#0e1a20;
  --panel:#15232b;
  --panel-2:#1c2f39;
  --line:#2b4350;
  --text:#eef2ee;
  --dim:#a2b5b8;
  --faint:#6e858c;
  --sign:#17704a;        /* highway-sign green */
  --accent:#f4c430;      /* signal yellow */
  --accent-ink:#221a00;
  --good:#5fd28d;
  --bad:#ff6b5b;
  --warn:#ffcf5a;
  --f-d:'Overpass','Highway Gothic','Arial Narrow',system-ui,sans-serif;
  --f-m:'Overpass Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--f-d);font-size:14px;line-height:1.4;-webkit-user-select:none;user-select:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:.01em;line-height:1.05;text-wrap:balance}
.mono{font-family:var(--f-m);font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}.faint{color:var(--faint)}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
#bar,#stage{min-width:0}
#bar{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;background:linear-gradient(#13212a,#101c23);border-bottom:2px solid var(--sign);padding-top:calc(6px + env(safe-area-inset-top,0px));padding-bottom:6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));z-index:5}
.brand{display:flex;align-items:center;gap:8px}
.brand .sign{background:var(--sign);color:#fff;font-weight:900;font-size:13px;letter-spacing:.08em;padding:4px 8px 2px;border-radius:4px;border:2px solid #fff;text-transform:uppercase;white-space:nowrap}
.brand small{color:var(--dim);font-size:12px;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.kpi{display:flex;flex-direction:column;line-height:1.1}
.kpi label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:700}
.kpi b{font-family:var(--f-m);font-size:15px;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 9px;cursor:pointer;color:var(--dim);font-weight:700;font-size:12.5px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.menu{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none;max-width:100%}
.menu::-webkit-scrollbar{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);padding:6px 10px;border-radius:5px;cursor:pointer;font-weight:700;font-size:13px;white-space:nowrap;line-height:1.1}
.btn:hover{border-color:var(--dim)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:3px 7px;font-size:12px}
.btn.ghost{background:transparent}
.btn.bad{background:transparent;border-color:rgba(255,107,91,.5);color:var(--bad)}
#stage{position:relative;overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#cv.build{cursor:crosshair}
#tools{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:10px;display:flex;flex-direction:column;gap:6px;z-index:3}
.tool{width:64px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px 5px;border-radius:7px;border:1px solid var(--line);background:rgba(21,35,43,.94);cursor:pointer;color:var(--dim);font-size:11px;font-weight:700}
.tool svg{width:24px;height:24px}
.tool.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tool:hover{color:var(--text)}
.tool.on:hover{color:var(--accent-ink)}
#insp{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:10px;width:360px;max-height:calc(100% - 20px);overflow:auto;background:rgba(21,35,43,.97);border:1px solid var(--line);border-radius:8px;z-index:4;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.ph{display:flex;align-items:flex-start;gap:10px;padding:14px 14px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.ph h2{font-size:21px}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:3px}
.pb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px}
.sec h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.kv span:nth-child(odd){color:var(--dim)}
.kv span:nth-child(even){font-family:var(--f-m);text-align:right}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px 1px;border-radius:999px;font-size:11.5px;font-weight:700;border:1px solid var(--line);white-space:nowrap;background:var(--panel-2)}
.chip i{width:9px;height:9px;border-radius:2px;display:inline-block;border:1px solid rgba(0,0,0,.4)}
.chip.on{border-color:var(--accent);color:var(--accent)}
button.chip{cursor:pointer}
.req{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px;align-items:center}
.req .bar{grid-column:1/3;height:7px;border-radius:9px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line);margin-bottom:6px}
.req .bar i{display:block;height:100%;background:var(--accent)}
.req .bar i.ok{background:var(--good)}
.streak{display:inline-flex;gap:4px}.streak i{width:12px;height:12px;border-radius:3px;background:var(--panel-2);border:1px solid var(--line)}.streak i.on{background:var(--good);border-color:var(--good)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:5px 6px;border-bottom:1px solid rgba(43,67,80,.55);white-space:nowrap}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--f-m);font-variant-numeric:tabular-nums}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:rgba(255,255,255,.04)}
.ord{display:grid;grid-template-columns:22px 1fr auto auto;gap:6px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2)}
.ord.cur{border-color:var(--accent)}
.ord b{font-family:var(--f-m);color:var(--accent);text-align:center}
.model{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2)}
.model .st{grid-column:1/3;font-size:12px;color:var(--dim);font-family:var(--f-m)}
#win{position:absolute;inset:0;z-index:8;background:rgba(5,12,16,.6);display:grid;place-items:center;padding:16px}
#win .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(820px,100%);max-height:100%;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.5)}
#win .box .pb{padding:14px 18px 18px}
.tw{overflow-x:auto}
#hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font-weight:800;padding:7px 12px;border-radius:6px;z-index:6;display:flex;gap:10px;align-items:center;max-width:calc(100% - 180px);font-size:13px}
#tip{position:absolute;pointer-events:none;z-index:6;background:rgba(10,20,26,.95);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:12.5px;max-width:280px}
#tut{position:absolute;left:calc(max(10px,env(safe-area-inset-left,0px)) + 76px);top:10px;width:270px;background:rgba(21,35,43,.95);border:1px solid var(--line);border-radius:8px;padding:10px 12px;z-index:3;font-size:12.5px}
#tut h3{font-size:13px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
#tut li{margin:3px 0;color:var(--dim);list-style:none;display:grid;grid-template-columns:18px 1fr;gap:4px}
#tut li.done{color:var(--faint);text-decoration:line-through}
#tut ul{margin:0;padding:0}
#mini{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));width:200px;height:100px;border:1px solid var(--line);border-radius:6px;background:#0b151a;z-index:3;cursor:pointer}
#toasts{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:7;pointer-events:none;width:min(560px,calc(100% - 24px))}
.toast{background:rgba(238,242,238,.96);color:#0e1a20;font-weight:700;padding:8px 13px;border-radius:6px;box-shadow:0 8px 22px rgba(0,0,0,.4);font-size:13px;text-align:center}
.toast.good{background:var(--good)}.toast.bad{background:#ffb2a8}
#start{position:absolute;inset:0;z-index:9;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at center,rgba(14,26,32,.55),rgba(14,26,32,.9))}
#start .card{background:rgba(21,35,43,.97);border:1px solid var(--line);border-radius:12px;padding:26px 24px;width:min(520px,100%);box-shadow:0 30px 60px rgba(0,0,0,.5)}
#start h1{font-size:clamp(40px,9vw,64px);font-weight:900;line-height:.9;letter-spacing:-.01em}
#start h1 span{display:block;color:var(--accent)}
.signbig{display:inline-block;background:var(--sign);border:3px solid #fff;border-radius:8px;padding:10px 14px 6px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:4px}
.field input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font-size:15px;-webkit-user-select:text;user-select:text}
textarea.inp{width:100%;min-height:90px;background:var(--bg);border:1px solid var(--line);border-radius:6px;font-family:var(--f-m);font-size:11px;color:var(--text);-webkit-user-select:text;user-select:text}
.chain{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:7px 0;border-bottom:1px solid rgba(43,67,80,.55);font-size:13px}
.chain .ar{color:var(--faint)}
.chain b{font-weight:800}
@media (max-width:760px){
  #bar{gap:6px 10px}
  .brand small{display:none}
  .menu{order:5;width:100%;margin-left:0}
  #tools{left:0;right:0;top:auto;bottom:0;flex-direction:row;justify-content:center;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));background:rgba(14,26,32,.95);border-top:1px solid var(--line);gap:4px}
  .tool{width:auto;flex:1;max-width:80px}
  #insp{left:0;right:0;top:auto;bottom:0;width:auto;max-height:52%;border-radius:12px 12px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  #mini{display:none}
  #tut{left:8px;top:8px;width:230px}
  #toasts{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  #hint{max-width:calc(100% - 16px);top:auto;bottom:calc(80px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="bar"></header>
  <div id="stage">
    <canvas id="cv" aria-label="Map"></canvas>
    <div id="tools"></div>
    <div id="tut" hidden></div>
    <canvas id="mini" width="400" height="200" aria-label="Overview map"></canvas>
    <aside id="insp" hidden></aside>
    <div id="hint" hidden></div>
    <div id="tip" hidden></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="win" hidden></div>
    <div id="start" hidden></div>
  </div>
</div>
<script>
'use strict';
/* =========================================================
   Freight Empire — step 1: roads, buses, mail and trucks.
   All towns, companies and vehicles are invented.
   ========================================================= */
const SAVE='freight-empire-v1';
const MW=80,MH=80,CR=3;
let S=null;
const UI={tool:'sel',sel:null,hov:-1,cam:{ox:0,oy:0,z:1},speed:1,paused:false,route:null,roadStart:-1,pickFor:null,depCls:'bus',floats:[],smoke:[],drag:null,pinch:null,ptrs:new Map(),panelHover:false,lastPanel:0,acc:0,t:0,started:false};
const R=Math.random,ri=(a,b)=>a+Math.floor(R()*(b-a+1)),pick=a=>a[Math.floor(R()*a.length)],clamp=(v,a,b)=>v<a?a:v>b?b:v;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const T=(x,y)=>y*MW+x,TX=i=>i%MW,TY=i=>(i/MW)|0,inM=(x,y)=>x>=0&&y>=0&&x<MW&&y<MH;
const N4=[[1,0],[-1,0],[0,1],[0,-1]];
const dist=(a,b)=>Math.abs(TX(a)-TX(b))+Math.abs(TY(a)-TY(b));
function eur(n){const s=Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');return (n<0?'−':'')+'€'+s}
const num=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');
const MS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ML=['January','February','March','April','May','June','July','August','September','October','November','December'];
const dateOf=d=>new Date(Date.UTC(1950,0,1)+d*864e5);
const fmtD=(d,long)=>{const t=dateOf(d);return long?`${t.getUTCDate()} ${ML[t.getUTCMonth()]} ${t.getUTCFullYear()}`:`${t.getUTCDate()} ${MS[t.getUTCMonth()]} ${t.getUTCFullYear()}`};
const yearOf=d=>dateOf(d).getUTCFullYear();

/* ---------- cargo ---------- */
const CG={
 pax:{n:'Passengers',u:'pax',r:9,d1:12,d2:40,c:'#8fd3ff'},
 mail:{n:'Mail',u:'bags',r:12,d1:10,d2:35,c:'#f2eee2'},
 grain:{n:'Grain',u:'t',r:6,d1:30,d2:120,c:'#e8c35a'},
 livestock:{n:'Livestock',u:'head',r:8,d1:12,d2:40,c:'#a0673a'},
 milk:{n:'Milk',u:'t',r:9,d1:5,d2:18,c:'#f7f7f2'},
 wood:{n:'Wood',u:'t',r:6,d1:30,d2:150,c:'#8a5a2b'},
 stone:{n:'Stone',u:'t',r:5,d1:40,d2:200,c:'#a7a9a8'},
 coal:{n:'Coal',u:'t',r:6,d1:40,d2:200,c:'#2c2c2c'},
 iron:{n:'Iron ore',u:'t',r:6,d1:40,d2:200,c:'#9c4a32'},
 goldore:{n:'Gold ore',u:'t',r:9,d1:40,d2:200,c:'#c9a640'},
 silverore:{n:'Silver ore',u:'t',r:8,d1:40,d2:200,c:'#b9c2c8'},
 oil:{n:'Crude oil',u:'t',r:7,d1:30,d2:150,c:'#151515'},
 bread:{n:'Bread',u:'t',r:11,d1:6,d2:25,c:'#d9a066'},
 beer:{n:'Beer',u:'t',r:11,d1:20,d2:80,c:'#e0a526'},
 meat:{n:'Meat',u:'t',r:14,d1:6,d2:22,c:'#c4453b'},
 dairy:{n:'Dairy',u:'t',r:13,d1:7,d2:25,c:'#fff3c4'},
 lumber:{n:'Lumber',u:'t',r:9,d1:40,d2:200,c:'#c08a4a'},
 furniture:{n:'Furniture',u:'t',r:16,d1:30,d2:120,c:'#7b4a2a'},
 cement:{n:'Cement',u:'t',r:8,d1:40,d2:200,c:'#cfcfc9'},
 steel:{n:'Steel',u:'t',r:11,d1:40,d2:200,c:'#6f8796'},
 machines:{n:'Machinery',u:'t',r:16,d1:30,d2:150,c:'#3d7fb5'},
 fuel:{n:'Fuel',u:'t',r:11,d1:30,d2:120,c:'#ff8c2a'},
 plastic:{n:'Plastics',u:'t',r:11,d1:40,d2:200,c:'#b05bd6'},
 goods:{n:'Goods',u:'t',r:15,d1:20,d2:90,c:'#e05a9b'},
 gold:{n:'Gold',u:'t',r:60,d1:20,d2:90,c:'#ffd23f'},
 silver:{n:'Silver',u:'t',r:40,d1:20,d2:90,c:'#e3e8ec'},
 jewel:{n:'Jewellery',u:'t',r:70,d1:20,d2:90,c:'#7ee3d0'},
};
const TOWNC={food:['bread','beer','meat','dairy'],build:['lumber','cement'],fuel:['fuel'],goods:['goods'],furniture:['furniture'],jewel:['jewel']};
const CATN={food:'Food',build:'Building materials',fuel:'Fuel',goods:'Goods',furniture:'Furniture',jewel:'Jewellery'};
const TOWN_ACC=['pax','mail','bread','beer','meat','dairy','lumber','cement','fuel','goods','furniture','jewel'];
const cchip=(c,extra='')=>`<span class="chip"><i style="background:${CG[c].c}"></i>${CG[c].n}${extra}</span>`;

/* ---------- vehicles ---------- */
const VC={
 bus:{n:'Bus',cg:['pax'],col:'#e8b23a'},
 mail:{n:'Mail van',cg:['mail'],col:'#d93a3a'},
 flat:{n:'Flatbed truck',cg:['wood','lumber','steel','machines','cement'],col:'#4a7bb0'},
 dump:{n:'Dump truck',cg:['coal','stone','iron','goldore','silverore','grain'],col:'#c7802c'},
 tank:{n:'Tanker',cg:['oil','fuel','milk'],col:'#c3cacf'},
 reefer:{n:'Refrigerated truck',cg:['meat','dairy'],col:'#f2f2f2'},
 box:{n:'Box truck',cg:['bread','beer','goods','furniture','plastic'],col:'#3e9a6b'},
 cattle:{n:'Livestock truck',cg:['livestock'],col:'#8b5a33'},
 armor:{n:'Armoured truck',cg:['gold','silver','jewel'],col:'#5d6b52'},
};
const MODELS=[
 ['ba50','bus','Bus B-50',1950,31,56,14000,3200,15,.86],['ba66','bus','Bus B-66',1966,44,80,26000,4800,16,.9],['ba82','bus','Bus B-82',1982,62,100,48000,7600,18,.94],
 ['pd50','mail','Mail Van M-50',1950,20,60,12000,2800,14,.86],['pd72','mail','Mail Van M-72',1972,34,90,24000,4400,16,.92],
 ['v50','flat','Flatbed F-50',1950,18,50,16000,3500,15,.85],['v68','flat','Flatbed F-68',1968,26,72,30000,5600,16,.9],['v85','flat','Flatbed F-85',1985,34,95,52000,8800,18,.94],
 ['s50','dump','Dumper D-50',1950,20,45,15500,3400,15,.85],['s70','dump','Dumper D-70',1970,30,70,29000,5400,16,.9],['s88','dump','Dumper D-88',1988,40,90,50000,8600,18,.94],
 ['c50','tank','Tanker T-50',1950,16,48,18000,3800,15,.85],['c72','tank','Tanker T-72',1972,26,75,33000,6000,16,.9],['c90','tank','Tanker T-90',1990,36,95,56000,9200,18,.94],
 ['ch50','reefer','Reefer R-50',1950,10,50,20000,4200,14,.84],['ch75','reefer','Reefer R-75',1975,20,80,36000,6400,16,.9],['ch92','reefer','Reefer R-92',1992,28,100,58000,9400,18,.94],
 ['sk50','box','Box Van X-50',1950,15,55,15000,3300,15,.86],['sk72','box','Box Van X-72',1972,24,80,29000,5200,16,.91],['sk90','box','Box Van X-90',1990,32,100,50000,8400,18,.94],
 ['d50','cattle','Stock Truck L-50',1950,14,45,15000,3300,15,.85],['d74','cattle','Stock Truck L-74',1974,22,72,28000,5200,16,.9],
 ['o50','armor','Armoured A-50',1950,6,58,32000,6000,15,.88],['o78','armor','Armoured A-78',1978,10,90,56000,9000,17,.93],
].map(a=>({id:a[0],cls:a[1],n:a[2],y:a[3],cap:a[4],kmh:a[5],price:a[6],run:a[7],life:a[8],rel:a[9]}));
const MD=Object.fromEntries(MODELS.map(m=>[m.id,m]));
const tilesPerDay=kmh=>kmh/20;

/* ---------- industries ---------- */
const IND={

/* ---------- noise & map generation ---------- */
function noise(seed){const rnd=(x,y)=>{let h=(Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(seed,69069))|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967296};
 return (x,y)=>{const x0=Math.floor(x),y0=Math.floor(y),fx=x-x0,fy=y-y0;const s=t=>t*t*(3-2*t);const a=rnd(x0,y0),b=rnd(x0+1,y0),c=rnd(x0,y0+1),d=rnd(x0+1,y0+1);const u=s(fx),v=s(fy);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}}
function hash(i){let h=Math.imul(i^0x5bd1e995,0x27d4eb2d);h^=h>>>15;return (h>>>0)/4294967296}
function genWorld(){
  S={v:1,ver:1,day:0,money:250000,loan:0,maxLoan:300000,co:'My Transport Co.',terr:[],road:[],obj:[],oid:[],towns:[],inds:[],stations:[],depots:[],vehs:[],news:[],fin:{y:blankFin(),ly:null},nid:1,neg:0,tut:{},roadsOwned:0,started:false,firsts:{},seen1950:true};
  const seed=ri(1,1e9),n1=noise(seed),n2=noise(seed+7),n3=noise(seed+13),n4=noise(seed+21);const edge=ri(0,3);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const w=n1(x/11,y/11)*.65+n2(x/4.5,y/4.5)*.35;const de=[x,MW-1-x,y,MH-1-y][edge];const sea=de<2+n3(x/7,y/7)*7;S.terr.push(sea||w<.2?1:0);S.road.push(0);S.obj.push('');S.oid.push(-1)}
  // a river running to the sea
  let rx,ry;const far=[[MW-3,ri(10,MH-10)],[2,ri(10,MH-10)],[ri(10,MW-10),MH-3],[ri(10,MW-10),2]][edge];[rx,ry]=far;const dir=[[-1,0],[1,0],[0,-1],[0,1]][edge];
  for(let k=0;k<200;k++){if(!inM(rx,ry))break;const i=T(rx,ry);if(S.terr[i]===1&&k>4)break;S.terr[i]=1;if(R()<.6){rx+=dir[0];ry+=dir[1]}else{const s=R()<.5?1:-1;if(dir[0])ry+=s;else rx+=s}}
  for(let i=0;i<MW*MH;i++){if(S.terr[i])continue;const x=TX(i),y=TY(i);if(n4(x/6,y/6)>.63&&R()<.85||R()<.025)S.obj[i]='t'}
  // towns
  const used=new Set();let tries=0;const levels=[3,2,2,2,1,1,1,1,1];
  while(S.towns.length<levels.length&&tries++<4000){const x=ri(6,MW-7),y=ri(6,MH-7);if(S.terr[T(x,y)])continue;
    let land=0;for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++)if(!S.terr[T(x+dx,y+dy)])land++;if(land<70)continue;
    if(S.towns.some(t=>Math.abs(t.x-x)+Math.abs(t.y-y)<15))continue;
    let nm;do{const a=pick(TN1),b=pick(TN2);nm=(R()<.12?pick(['Upper ','Lower ','New ','Old ']):'')+a+b}while(used.has(nm)||[...used].some(u=>u.replace(/^(Upper|Lower|New|Old) /,'').slice(0,3)===nm.replace(/^(Upper|Lower|New|Old) /,'').slice(0,3)));used.add(nm);
    const t={id:S.nid++,name:nm,x,y,lv:levels[S.towns.length],houses:[],dl:{},ld:{},gen:0,taken:0,lgen:0,ltak:0,streak:0,pw:false};S.towns.push(t);buildTown(t)}
  // industries
  for(const [type,n] of PLACE)for(let k=0;k<n;k++)placeInd(type);
  S.ver++;
}
function freeLand(i){return S.terr[i]===0&&(S.obj[i]===''||S.obj[i]==='t')&&!S.road[i]}
function buildTown(t){
  const arm=[0,3,4,6,8,10][t.lv];
  const lay=(x,y)=>{if(!inM(x,y))return false;const i=T(x,y);if(S.terr[i]||S.obj[i]==='H'||S.obj[i]==='I'||S.obj[i]==='D')return false;S.road[i]=2;S.obj[i]='';return true};
  for(const [dx,dy] of N4)for(let k=0;k<=arm;k++)if(!lay(t.x+dx*k,t.y+dy*k))break;
  if(t.lv>=2)for(const o of [-3,3]){for(let k=-arm+2;k<=arm-2;k++){lay(t.x+k,t.y+o);lay(t.x+o,t.y+k)}}
  addHouses(t,[0,8,16,32,50,70][t.lv]);
}
function housePop(lv){const r=HP[lv];return ri(r[0],r[1])}
function houseShape(t,h){const lv=t.lv;h.w=.5+R()*.28;h.d=.5+R()*.28;h.h=lv<=2?ri(9,14):lv===3?ri(12,26):lv===4?ri(18,50):ri(26,86);h.flat=lv>=4?R()<.85:lv===3?R()<.35:false;h.c=pick(lv>=4?['#c9c3b5','#a9b3b8','#d8cdb4','#8f9aa3','#b9a48a']:['#e7dcc2','#d9c39a','#efe6d2','#cdb68d','#e2d0b8','#c9b9a6']);h.rc=pick(['#8c3b2f','#7a3328','#5e4a3c','#94452f','#6b6058'])}
function addHouses(t,n){
  let placed=0,tries=0;const rad=3+t.lv*2;
  while(placed<n&&tries<n*60){tries++;
    if(tries%25===0)extendTownRoad(t);
    const x=t.x+ri(-rad,rad),y=t.y+ri(-rad,rad);if(!inM(x,y))continue;const i=T(x,y);if(!freeLand(i))continue;
    if(!N4.some(([dx,dy])=>inM(x+dx,y+dy)&&S.road[T(x+dx,y+dy)]))continue;
    const h={i,pop:housePop(t.lv)};houseShape(t,h);S.obj[i]='H';S.oid[i]=t.id;t.houses.push(h);placed++}
  S.ver++;
}
function extendTownRoad(t){
  const rad=4+t.lv*2;const cands=[];
  for(let y=t.y-rad;y<=t.y+rad;y++)for(let x=t.x-rad;x<=t.x+rad;x++)if(inM(x,y)&&S.road[T(x,y)]===2)cands.push([x,y]);
  if(!cands.length)return;const [x,y]=pick(cands);const [dx,dy]=pick(N4);
  for(let k=1;k<=ri(2,4);k++){const nx=x+dx*k,ny=y+dy*k;if(!inM(nx,ny))break;const i=T(nx,ny);if(S.road[i])break;if(!freeLand(i))break;S.road[i]=2;S.obj[i]=''}
}
function placeInd(type){
  const D=IND[type];
  for(let tries=0;tries<900;tries++){
    const x=ri(2,MW-5),y=ri(2,MH-5);let ok=true;
    for(let dy=-1;dy<=3&&ok;dy++)for(let dx=-1;dx<=3&&ok;dx++){const i=T(x+dx,y+dy);if(S.terr[i]||S.road[i]||(S.obj[i]!==''&&S.obj[i]!=='t'))ok=false}
    if(!ok)continue;
    if(S.towns.some(t=>Math.abs(t.x-x-1)+Math.abs(t.y-y-1)<(t.lv*2+6)))continue;
    if(S.inds.some(o=>Math.abs(o.x-x)<5&&Math.abs(o.y-y)<5))continue;
    if(!D.pr&&tries<600&&!S.towns.some(t=>Math.abs(t.x-x)+Math.abs(t.y-y)<24))continue;
    if(type==='forest'&&tries<500){let tr=0;for(let dy=-2;dy<=4;dy++)for(let dx=-2;dx<=4;dx++)if(inM(x+dx,y+dy)&&S.obj[T(x+dx,y+dy)]==='t')tr++;if(tr<8)continue}
    const [tn]=nearestTown(T(x+1,y+1));
    let name=`${tn?tn.name+' ':''}${D.n}`;let k=2;while(S.inds.some(o=>o.name===name))name=`${tn.name} ${D.n} ${k++}`;
    const ind={id:S.nid++,t:type,x,y,name,mult:+(0.75+R()*.5).toFixed(2),out:{},inp:{},pm:{},tr:{},lpm:{},ltr:{},boost:0,powered:false};
    for(let dy=0;dy<3;dy++)for(let dx=0;dx<3;dx++){const i=T(x+dx,y+dy);S.obj[i]='I';S.oid[i]=ind.id}
    S.inds.push(ind);return ind;
  }
}

/* ---------- catchment cache ---------- */
let CACHE={ver:-1};
function cache(){
  if(CACHE.ver===S.ver)return CACHE;
  const c={ver:S.ver,st:new Map(),indSt:new Map(),houseSt:new Map(),stAt:new Map(),houseOf:new Map()};
  for(const t of S.towns)for(const h of t.houses)c.houseOf.set(h.i,[t,h]);
  for(const st of S.stations){c.stAt.set(st.i,st);
    const x=TX(st.i),y=TY(st.i);const inds=new Set();const tc={};let houses=0;let bank=null;
    for(let dy=-CR;dy<=CR;dy++)for(let dx=-CR;dx<=CR;dx++){if(!inM(x+dx,y+dy))continue;const i=T(x+dx,y+dy);
      if(S.obj[i]==='I')inds.add(S.oid[i]);
      else if(S.obj[i]==='H'){houses++;tc[S.oid[i]]=(tc[S.oid[i]]||0)+1;const ho=c.houseOf.get(i);if(ho&&ho[1].bank)bank=ho[0].id;(c.houseSt.get(i)||c.houseSt.set(i,[]).get(i)).push(st)}}
    const acc=new Set();for(const id of inds){const ind=indById(id);if(ind)for(const a of accOf(ind.t))acc.add(a);(c.indSt.get(id)||c.indSt.set(id,[]).get(id)).push(st)}
    let town=null,best=0;for(const k in tc)if(tc[k]>best){best=tc[k];town=+k}
    if(houses>=3)for(const a of TOWN_ACC)acc.add(a);
    if(bank){acc.add('gold');acc.add('silver')}
    const sup=new Set();for(const id of inds){const ind=indById(id);if(ind)for(const o of outOf(ind.t))sup.add(o)}if(houses){sup.add('pax');sup.add('mail')}
    c.st.set(st.id,{inds:[...inds],houses,town,bank,acc,sup});
  }
  CACHE=c;return c;
}
function previewCatch(i){const x=TX(i),y=TY(i);const inds=new Set();let houses=0;let bank=false;const C=cache();
  for(let dy=-CR;dy<=CR;dy++)for(let dx=-CR;dx<=CR;dx++){if(!inM(x+dx,y+dy))continue;const j=T(x+dx,y+dy);if(S.obj[j]==='I')inds.add(S.oid[j]);else if(S.obj[j]==='H'){houses++;const ho=C.houseOf.get(j);if(ho&&ho[1].bank)bank=true}}
  const acc=new Set(),sup=new Set();for(const id of inds){const ind=indById(id);for(const a of accOf(ind.t))acc.add(a);for(const o of outOf(ind.t))sup.add(o)}
  if(houses>=3)for(const a of TOWN_ACC)acc.add(a);if(houses){sup.add('pax');sup.add('mail')}if(bank){acc.add('gold');acc.add('silver')}
  return {acc,sup,houses};
}

/* ---------- pathfinding ---------- */
function astar(a,b,pass,cost){
  const N=MW*MH;const gS=new Float64Array(N).fill(Infinity);const from=new Int32Array(N).fill(-1);const closed=new Uint8Array(N);
  const bx=TX(b),by=TY(b);const h=i=>Math.abs(TX(i)-bx)+Math.abs(TY(i)-by);
  const hp=[];const push=(f,i)=>{hp.push([f,i]);let k=hp.length-1;while(k>0){const p=(k-1)>>1;if(hp[p][0]<=hp[k][0])break;[hp[p],hp[k]]=[hp[k],hp[p]];k=p}};
  const pop=()=>{const top=hp[0];const last=hp.pop();if(hp.length){hp[0]=last;let k=0;for(;;){const l=2*k+1,r=l+1;let m=k;if(l<hp.length&&hp[l][0]<hp[m][0])m=l;if(r<hp.length&&hp[r][0]<hp[m][0])m=r;if(m===k)break;[hp[m],hp[k]]=[hp[k],hp[m]];k=m}}return top[1]};
  gS[a]=0;push(h(a),a);let n=0;
  while(hp.length&&n++<20000){const i=pop();if(i===b)break;if(closed[i])continue;closed[i]=1;const x=TX(i),y=TY(i);
    for(const [dx,dy] of N4){const nx=x+dx,ny=y+dy;if(!inM(nx,ny))continue;const j=T(nx,ny);if(closed[j]||!pass(j))continue;const ng=gS[i]+cost(j);if(ng<gS[j]){gS[j]=ng;from[j]=i;push(ng+h(j),j)}}}
  if(a!==b&&from[b]===-1)return null;
  const p=[b];let k=b;while(k!==a){k=from[k];p.push(k)}return p.reverse();
}
const PC=new Map();let PCver=-1;
function vpath(a,b){if(PCver!==S.ver){PC.clear();PCver=S.ver}const key=a+'-'+b;if(PC.has(key))return PC.get(key);
  const p=astar(a,b,j=>j===b||S.road[j]>0,()=>1);PC.set(key,p);return p}
function roadPlan(a,b){
  const ok=j=>{const o=S.obj[j];return o!=='H'&&o!=='I'&&o!=='D'};
  if(!ok(a)||!ok(b))return null;
  return astar(a,b,ok,j=>S.road[j]?.35:S.terr[j]?7:S.obj[j]==='t'?1.5:1);
}
function routeCost(p){let c=0,n=0;for(const i of p){if(S.road[i])continue;n++;c+=S.terr[i]?2200:250+(S.obj[i]==='t'?150:0)}return [c,n]}

/* ---------- building ---------- */
function canAfford(c){if(S.money>=c)return true;toast(`You can't afford that. It costs ${eur(c)}.`,'bad');return false}
function spend(c,k='build'){S.money-=c;S.fin.y[k]+=c}
function buildRoute(p){
  const [cost,n]=routeCost(p);if(!n)return;if(!canAfford(cost))return;spend(cost);
  for(const i of p)if(!S.road[i]){S.road[i]=1;S.obj[i]='';S.roadsOwned++}
  S.ver++;S.tut.road=true;rerouteAll();toast(`Road built: ${n} tiles for ${eur(cost)}`);
}
function placeStation(i){
  if(!S.road[i])return toast('Build stops directly on a road.','bad');
  if(cache().stAt.has(i))return toast('There is already a stop here.','bad');
  if(!canAfford(2500))return;spend(2500);
  const [tn,d]=nearestTown(i);const pc=previewCatch(i);let name;
  if(pc.houses>=3||d<8){const sfx=['',' Square',' North',' South',' East',' West',' Central',' High Street',' Park',' Market'];name=tn.name;let k=0;while(S.stations.some(s=>s.name===name)&&k<sfx.length)name=tn.name+sfx[++k];if(S.stations.some(s=>s.name===name))name=tn.name+' '+S.nid}
  else{const ind=S.inds.filter(o=>Math.abs(o.x+1-TX(i))<=CR+1&&Math.abs(o.y+1-TY(i))<=CR+1).sort((a,b)=>dist(T(a.x+1,a.y+1),i)-dist(T(b.x+1,b.y+1),i))[0];const base=ind?ind.name:`${tn.name} Junction`;name=base;let k=2;while(S.stations.some(s=>s.name===name))name=`${base} ${k++}`}
  const st={id:S.nid++,name,i,cg:{},rt:{},lp:{},ls:{},seen:{}};S.stations.push(st);S.ver++;S.tut.stops=(S.tut.stops||0)+1;
  toast(`Stop built: ${name}`);select('st',st.id);
}
function placeDepot(i){
  if(!freeLand(i))return toast('A depot needs a free tile next to a road.','bad');
  const x=TX(i),y=TY(i);if(!N4.some(([dx,dy])=>inM(x+dx,y+dy)&&S.road[T(x+dx,y+dy)]))return toast('A depot must be right next to a road.','bad');
  if(!canAfford(6000))return;spend(6000);const [tn]=nearestTown(i);
  const d={id:S.nid++,i,name:`${tn.name} Depot`};S.depots.push(d);S.obj[i]='D';S.oid[i]=d.id;S.ver++;S.tut.depot=true;
  toast(`${d.name} built. Click it to buy a vehicle.`);select('dep',d.id);
}
function demolish(i){
  const C=cache();const st=C.stAt.get(i);
  if(st){if(!canAfford(400))return;spend(400);S.stations=S.stations.filter(s=>s!==st);for(const v of S.vehs){const before=v.orders.length;v.orders=v.orders.filter(o=>o.s!==st.id);if(v.orders.length!==before){v.oi=Math.min(v.oi,Math.max(0,v.orders.length-1));if(!v.orders.length)v.state='stop'}if(v.from===st.id)v.from=-1}S.ver++;closeInsp();return toast(`Stop ${st.name} demolished.`)}
  if(S.obj[i]==='D'){const d=depById(S.oid[i]);if(S.vehs.some(v=>v.ti===i&&v.state==='stop'))return toast('Vehicles are parked in this depot. Sell them or send them out first.','bad');if(!canAfford(400))return;spend(400);S.depots=S.depots.filter(x=>x!==d);S.obj[i]='';S.oid[i]=-1;S.ver++;closeInsp();rerouteAll();return toast('Depot demolished.')}
  if(S.road[i]===2)return toast("Town streets belong to the town. You can't demolish them.",'bad');
  if(S.road[i]===1){if(S.vehs.some(v=>v.ti===i&&v.state!=='stop'))return toast('A vehicle is on this road right now.','bad');if(!canAfford(100))return;spend(100);S.road[i]=0;S.roadsOwned--;S.ver++;rerouteAll();return}
  if(S.obj[i]==='t'){if(!canAfford(80))return;spend(80);S.obj[i]='';S.ver++;return}
  if(S.obj[i]==='H')return toast('Houses belong to the townspeople.','bad');
  if(S.obj[i]==='I')return toast("Industries can't be demolished.",'bad');
}
function rerouteAll(){for(const v of S.vehs)if(v.state==='go'||v.state==='lost'){const cur=v.state==='go'?v.path[v.pi]:v.ti;v.ti=cur;planLeg(v)}}

/* ---------- vehicles ---------- */
function buyVehicle(dep,mid,cg){
  const m=MD[mid];if(!canAfford(m.price))return null;spend(m.price,'veh');
  const n=S.vehs.filter(v=>MD[v.m].cls===m.cls).length+1;

/* ---------- daily & monthly simulation ---------- */
function dayTick(){
  const before=dateOf(S.day);S.day++;const now=dateOf(S.day);
  const C=cache();
  for(const ind of S.inds){const D=IND[ind.t];
    if(D.pr)for(const c in D.pr){const a=D.pr[c]*ind.mult/30*(1+ind.boost/100);ind.out[c]=(ind.out[c]||0)+a;ind.pm[c]=(ind.pm[c]||0)+a}
    if(D.rec)processInd(ind,D);
    for(const c in ind.out){const a=ind.out[c];if(a<=0)continue;ind.out[c]=0;
      const sts=(C.indSt.get(ind.id)||[]).filter(s=>s.seen[c]);if(!sts.length)continue;
      sts.sort((p,q)=>(q.rt[c]||0)-(p.rt[c]||0));const best=sts.slice(0,2);const tot=best.reduce((s,x)=>s+(x.rt[c]||0),0)||1;const moved=a*(best[0].rt[c]||0)/100;
      for(const s of best)s.cg[c]=(s.cg[c]||0)+moved*(s.rt[c]||0)/tot;ind.tr[c]=(ind.tr[c]||0)+moved}
  }
  for(const t of S.towns)for(const h of t.houses){const gp=h.pop/220,gm=h.pop/900;t.gen+=gp;const sts=C.houseSt.get(h.i);if(!sts)continue;
    let bp=null,bm=null;for(const s of sts){if(s.seen.pax&&(!bp||s.rt.pax>bp.rt.pax))bp=s;if(s.seen.mail&&(!bm||s.rt.mail>bm.rt.mail))bm=s}
    if(bp){const m=gp*bp.rt.pax/100;bp.cg.pax=(bp.cg.pax||0)+m;t.taken+=m}if(bm){bm.cg.mail=(bm.cg.mail||0)+gm*bm.rt.mail/100}}
  for(const st of S.stations)for(const c in st.seen){const ds=S.day-(st.lp[c]??-999);let r=40+(ds<=7?33:ds<=14?25:ds<=30?12:ds<=60?0:-15)+clamp(((st.ls[c]||40)-40)/4,0,17);const w=st.cg[c]||0;r+=w<50?10:w<150?4:w<400?-6:-15;st.rt[c]=clamp((st.rt[c]??55)+(clamp(r,0,100)-(st.rt[c]??55))*.1,0,100);if(w>2000)st.cg[c]=w*.98}
  for(const v of S.vehs){v.age++;if(v.amt>0)v.days++;
    if(v.state==='load'){if(--v.wait<=0){const o=v.orders[v.oi];if(v.adv&&o&&o.full&&v.amt<v.cap&&v.fw<60){const st=stById(o.s);if(st)loadAt(v,st);v.fw++;if(v.amt<v.cap){v.wait=1;continue}}depart(v)}}

    else if(v.state==='broken'){if(--v.wait<=0)v.state='go'}
    else if(v.state==='go'){if(S.day-(v.legDay??S.day)>150){v.ti=v.path[v.pi];planLeg(v);continue}if(R()<(1-rel(v))*.012){v.state='broken';v.wait=3;v.brk++}}}

  if(now.getUTCFullYear()!==before.getUTCFullYear())yearTick(now.getUTCFullYear());
}
function processInd(ind,D){
  for(const [inp,out] of D.rec){const ks=Object.keys(inp);const have=ks.map(k=>(ind.inp[k]||0)/inp[k]);let k=Math.min(...have),eff=1;
    if(k<=.001&&ks.length>1){const mx=Math.max(...have);if(mx<=.001)continue;k=Math.min(mx,40);eff=.35;for(const c of ks)ind.inp[c]=Math.max(0,(ind.inp[c]||0)-k*inp[c])}

    for(const c in out){const a=k*out[c]*eff;ind.out[c]=(ind.out[c]||0)+a;ind.pm[c]=(ind.pm[c]||0)+a}
    if(D.power)ind.pm.power=(ind.pm.power||0)+k;
  }

function monthTick(prev){
  let run=0;for(const v of S.vehs)run+=MD[v.m].run/12;
  const infra=Math.round(S.roadsOwned*4+S.stations.length*60+S.depots.length*100);const intr=Math.round(S.loan*.05/12);
  S.money-=run+infra+intr;S.fin.y.run+=run;S.fin.y.infra+=infra;S.fin.y.intr+=intr;
  for(const ind of S.inds){ind.lpm=ind.pm;ind.ltr=ind.tr;ind.pm={};ind.tr={};ind.boost=Math.max(0,ind.boost-4);if(IND[ind.t].power)ind.powered=(ind.lpm.power||0)>=40}

  let grew=false;
  for(const t of S.towns){
    t.ld=t.dl;t.dl={};t.lgen=t.gen;t.ltak=t.taken;t.gen=0;t.taken=0;
    const L=LV[t.lv+1];

  if(miniVer!==S.ver){miniVer=S.ver;const m=miniBase.getContext('2d');m.fillStyle='#0b151a';m.fillRect(0,0,400,200);
    for(let i=0;i<MW*MH;i++){const x=TX(i),y=TY(i);const px=(x-y)*2.5+200,py=(x+y)*1.25;let c=S.terr[i]?'#2d6c99':'#4f7f35';if(S.obj[i]==='t')c='#2f5a2a';if(S.obj[i]==='H')c='#e8dfc8';if(S.obj[i]==='I')c='#c96b2c';if(S.road[i])c='#9aa0a4';m.fillStyle=c;m.fillRect(px-1.3,py,2.6,1.4)}}
  mg.drawImage(miniBase,0,0);const z=UI.cam.z;const corners=[[0,0],[VW,0],[VW,VH],[0,VH]].map(([sx,sy])=>{const a=(sx-UI.cam.ox)/(32*z),b=(sy-UI.cam.oy)/(16*z);const fx=(a+b)/2,fy=(b-a)/2;return [(fx-fy)*2.5+200,(fx+fy)*1.25]});
  mg.strokeStyle='#f4c430';mg.lineWidth=2;mg.beginPath();corners.forEach((c,k)=>k?mg.lineTo(c[0],c[1]):mg.moveTo(c[0],c[1]));mg.closePath();mg.stroke();
}

/* ---------- main loop ---------- */
function frame(ts){
  const dt=Math.min(.1,(ts-(UI.lt||ts))/1000);UI.lt=ts;UI.t+=dt;
  if(S&&S.started&&!UI.paused&&!S.over){const dd=dt*UI.speed;UI.acc+=dd;moveVehicles(dd);while(UI.acc>=1){UI.acc-=1;dayTick()}}
  for(const s of UI.smoke){s.life-=dt;s.h+=dt*16;s.r+=dt*2.2;s.fx+=dt*.1}UI.smoke=UI.smoke.filter(s=>s.life>0);if(UI.smoke.length>300)UI.smoke.splice(0,UI.smoke.length-300);
  for(const f of UI.floats)f.life-=dt;UI.floats=UI.floats.filter(f=>f.life>0);
  draw();drawMini();
  if(S&&S.started){if(ts-UI.lastPanel>500){UI.lastPanel=ts;renderBar();if(!UI.panelHover)renderInsp();renderTut()}}
  requestAnimationFrame(frame);
}

const TOOLS=[['sel','Select','<path d="M5 3l14 8-6 2-3 6z" fill="currentColor"/>'],['road','Road','<path d="M8 3L4 21M16 3l4 18M12 5v3M12 11v3M12 17v3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>'],['stop','Stop','<rect x="5" y="3" width="14" height="10" rx="2" fill="currentColor"/><path d="M12 13v8" stroke="currentColor" stroke-width="2"/>'],['depot','Depot','<path d="M3 11l9-7 9 7v9H3z" fill="currentColor"/><rect x="8" y="13" width="8" height="7" fill="#15232b"/>'],['bull','Demolish','<path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>']];
function renderTools(){$('#tools').innerHTML=TOOLS.map(([k,n,ic])=>`<button class="tool ${UI.tool===k?'on':''}" data-tool="${k}" title="${n}"><svg viewBox="0 0 24 24" aria-hidden="true">${ic}</svg>${n}</button>`).join('');cv.classList.toggle('build',UI.tool!=='sel')}
function setTool(k){UI.tool=k;UI.route=null;UI.roadStart=-1;UI.pickFor=null;renderTools();renderHint()}
function renderHint(){const h=$('#hint');let t='';
  if(UI.pickFor!=null){const v=vehById(UI.pickFor);t=`Click the stops ${esc(v?v.name:'the vehicle')} should visit. <button class="btn sm" data-act="pickdone">Done</button>`}
  else if(UI.tool==='road')t=UI.roadStart>=0?'Click where the road should end, or drag. Roads route around houses and industries.':'Drag from the start of the road to the end, or click the start and then the end.';
  else if(UI.tool==='stop')t='Click a road. The yellow square shows where the stop collects from and delivers to.';
  else if(UI.tool==='depot')t='Click a free tile right next to a road.';
  else if(UI.tool==='bull')t='Click one of your roads, stops or depots, or a tree.';
  h.hidden=!t;h.innerHTML=t}
function onTap(i){
  if(i<0||i>=MW*MH)return;const C=cache();
  if(UI.pickFor!=null){const st=C.stAt.get(i);const v=vehById(UI.pickFor);if(st&&v){v.orders.push({s:st.id,full:false});toast(`Added stop ${st.name} (#${v.orders.length})`);renderInsp(true)}else toast('There is no stop here.','bad');return}
  if(UI.tool==='road'){if(UI.roadStart<0){UI.roadStart=i;renderHint()}else{const p=roadPlan(UI.roadStart,i);if(p)buildRoute(p);else toast("A road can't be built there.",'bad');UI.roadStart=-1;UI.route=null;renderHint()}return}
  if(UI.tool==='stop')return placeStation(i);
  if(UI.tool==='depot')return placeDepot(i);
  if(UI.tool==='bull')return demolish(i);
  // select
  const x=TX(i),y=TY(i);
  let best=null,bd=.45;for(const v of S.vehs){if(v.state==='stop'&&S.obj[v.ti]==='D')continue;const p=vehPos(v);const d=Math.hypot(p.fx-(x+UI.fx),p.fy-(y+UI.fy));if(d<bd){bd=d;best=v}}
  if(best)return select('veh',best.id);
  if(C.stAt.has(i))return select('st',C.stAt.get(i).id);
  if(S.obj[i]==='D')return select('dep',S.oid[i]);
  if(S.obj[i]==='I')return select('ind',S.oid[i]);
  if(S.obj[i]==='H')return select('town',S.oid[i]);
  if(S.road[i]===2){const [t]=nearestTown(i);return select('town',t.id)}
  closeInsp();
}
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);UI.ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
  if(UI.ptrs.size===2){const [a,b]=[...UI.ptrs.values()];UI.pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:UI.cam.z,mx:(a.x+b.x)/2,my:(a.y+b.y)/2};UI.drag=null;UI.route=null;return}
  const [tx,ty]=tileAt(e.offsetX,e.offsetY);
  UI.drag={sx:e.offsetX,sy:e.offsetY,ox:UI.cam.ox,oy:UI.cam.oy,moved:false,start:inM(tx,ty)?T(tx,ty):-1,pan:e.button===1||e.button===2||(UI.tool==='sel'||UI.pickFor!=null)};
});
cv.addEventListener('pointermove',e=>{
  if(UI.ptrs.has(e.pointerId))UI.ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
  const [tx,ty]=tileAt(e.offsetX,e.offsetY);const a=(e.offsetX-UI.cam.ox)/ZW,b=(e.offsetY-UI.cam.oy)/ZH;UI.fx=((a+b)/2)%1;UI.fy=((b-a)/2)%1;
  UI.hov=inM(tx,ty)?T(tx,ty):-1;
  if(UI.pinch&&UI.ptrs.size===2){const [p,q]=[...UI.ptrs.values()];const d=Math.hypot(p.x-q.x,p.y-q.y);const mx=(p.x+q.x)/2,my=(p.y+q.y)/2;setZoom(UI.pinch.z*d/UI.pinch.d,mx,my);UI.cam.ox+=mx-UI.pinch.mx;UI.cam.oy+=my-UI.pinch.my;UI.pinch.mx=mx;UI.pinch.my=my;return}
  const D=UI.drag;
  if(D){const dx=e.offsetX-D.sx,dy=e.offsetY-D.sy;if(Math.hypot(dx,dy)>6)D.moved=true;
    if(D.pan){if(D.moved){UI.cam.ox=D.ox+dx;UI.cam.oy=D.oy+dy}}
    else if(UI.tool==='road'&&D.moved&&D.start>=0&&UI.hov>=0){UI.route=roadPlan(D.start,UI.hov)}}
  else if(UI.tool==='road'&&UI.roadStart>=0&&UI.hov>=0){UI.route=roadPlan(UI.roadStart,UI.hov)}
  updateTip(e);
});
function endPtr(e){
  UI.ptrs.delete(e.pointerId);if(UI.pinch){if(UI.ptrs.size<2)UI.pinch=null;UI.drag=null;return}
  const D=UI.drag;UI.drag=null;if(!D)return;
  if(!D.moved&&e.button!==2){const [tx,ty]=tileAt(e.offsetX,e.offsetY);onTap(inM(tx,ty)?T(tx,ty):-1);return}
  if(!D.pan&&UI.tool==='road'&&UI.route){buildRoute(UI.route);UI.route=null;UI.roadStart=-1;renderHint()}
}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',e=>{UI.ptrs.delete(e.pointerId);UI.pinch=null;UI.drag=null});

  else{tip.hidden=true;return}

const KEYS=new Set();
window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;KEYS.add(e.key.toLowerCase());

/* ---------- inspector ---------- */
function select(k,id){UI.sel={k,id};if(k==='veh'||k==='dep'){}renderInsp(true)}
function closeInsp(){UI.sel=null;$('#insp').hidden=true;UI.panelHover=false}
const ph=(eyebrow,title,extra='')=>`<div class="ph"><div style="flex:1;min-width:0"><div class="eyebrow">${eyebrow}</div><h2>${esc(title)}</h2>${extra}</div><button class="btn ghost sm" data-act="close" aria-label="Close">✕</button></div>`;
function renderInsp(force){
  const el=$('#insp');if(!UI.sel||!S){el.hidden=true;return}
  if(!force&&UI.panelHover)return;
  const {k,id}=UI.sel;let html='';
  if(k==='town'){const t=townById(id);if(!t)return closeInsp();html=pTown(t)}
  else if(k==='ind'){const o=indById(id);if(!o)return closeInsp();html=pInd(o)}
  else if(k==='st'){const st=stById(id);if(!st)return closeInsp();html=pSt(st)}
  else if(k==='dep'){const d=depById(id);if(!d)return closeInsp();html=pDep(d)}
  else if(k==='veh'){const v=vehById(id);if(!v)return closeInsp();html=pVeh(v)}
  el.innerHTML=html;el.hidden=false;
}
function pTown(t){
  const L=LV[t.lv+1];const cur=townStatus(t,t.dl);const last=townStatus(t,t.ld);
  const req=L?`<div class="sec"><h3>Next level: ${L.n}</h3><p class="dim" style="margin:0 0 8px;font-size:12.5px">The town needs these deliveries three months in a row. The count starts again every month.</p>
    <div class="req">${cur.rows.map((r,k)=>{const pct=r.bool?(r.have?100:0):clamp(r.have/r.need*100,0,100);const lr=last.rows[k];return `<span>${r.l}</span><span class="mono ${r.ok?'good':''}">${r.bool?(r.have?'yes':'no'):`${num(r.have)}${r.u?' '+r.u:''} / ${num(r.need)}${r.u?' '+r.u:''}`}</span><div class="bar" title="Last month: ${lr?(lr.bool?(lr.have?'yes':'no'):num(lr.have)):'-'}"><i class="${r.ok?'ok':''}" style="width:${pct}%"></i></div>`}).join('')}</div>
    <div class="row" style="margin-top:4px"><span class="dim" style="font-size:12.5px">Months met in a row</span><span class="streak">${[0,1,2].map(k=>`<i class="${k<t.streak?'on':''}"></i>`).join('')}</span></div></div>`:`<p class="good" style="margin:0">Top level. This is the biggest city in the region.</p>`;
  const lastD=Object.entries(t.ld).filter(([,a])=>a>0);
  return ph(`Town · ${LV[t.lv].n}`,t.name)+`<div class="pb">
   <div class="kv"><span>Population</span><span>${num(townPop(t))}</span><span>Houses</span><span>${t.houses.length}</span><span>Passengers last month</span><span>${num(t.lgen)}</span><span>Carried by you</span><span>${Math.round(t.ltak/Math.max(1,t.lgen)*100)}%</span><span>Bank</span><span>${t.houses.some(h=>h.bank)?'yes':'from Town level'}</span><span>Electricity</span><span>${t.pw?'yes':'no'}</span></div>
   ${req}
   <div class="sec"><h3>Delivered last month</h3><div class="row">${lastD.map(([c,a])=>cchip(c,` ${num(a)}`)).join('')||'<span class="dim">Nothing yet. Build a stop in town and bring goods in.</span>'}</div></div>
   <div class="sec"><h3>The town accepts</h3><div class="row">${TOWN_ACC.map(c=>cchip(c)).join('')}</div></div></div>`;
}
function pInd(o){

  const prod=outs.map(c=>{const p=o.lpm[c]||0,tr=o.ltr[c]||0;return `<span>${cchip(c)}</span><span>${num(p)} ${CG[c].u} · ${p?Math.round(tr/p*100):0}% transported</span>`}).join('');
  const where=outs.map(c=>{const t=Object.keys(IND).filter(k=>accOf(k).includes(c)).map(k=>IND[k].n);if(TOWN_ACC.includes(c))t.push('towns');if(c==='gold'||c==='silver')t.push('a bank in a large town');return `<div style="font-size:12.5px"><b>${CG[c].n}</b> <span class="dim">→ ${t.join(', ')}</span></div>`}).join('');

   ${where?`<div class="sec"><h3>Where it goes</h3>${where}</div>`:''}
   <p class="faint" style="font-size:12px;margin:0">Tip: a stop within 3 tiles collects this industry's output once a vehicle has called there to load.</p></div>`;
}

const STATE={stop:'Stopped',go:'On the road',load:'Loading / unloading',broken:'Broken down',lost:'Can\'t find a route',wait:'Waiting for cargo'};

   <div class="kv"><span>Cargo</span><span>${CG[v.cg].n}: ${num(v.amt)} / ${v.cap} ${CG[v.cg].u}</span><span>Profit this year</span><span class="${v.pt-m.run<0?'bad':'good'}">${eur(v.pt)}</span><span>Profit last year</span><span>${eur(v.pl)}</span><span>Running cost</span><span>${eur(m.run)} / yr</span><span>Age</span><span>${(v.age/365).toFixed(1)} of ${m.life} yrs</span><span>Reliability</span><span>${Math.round(rel(v)*100)}%</span><span>Speed</span><span>${m.kmh} km/h</span></div>
   <div class="sec"><h3>Route</h3><div style="display:flex;flex-direction:column;gap:6px">${v.orders.map((o,k)=>{const s=stById(o.s);return `<div class="ord ${k===v.oi?'cur':''}"><b>${k+1}</b><span>${esc(s?s.name:'?')}</span><button class="btn sm ${o.full?'pri':''}" data-full="${k}" title="Wait here until fully loaded">${o.full?'Full load':'Load what\'s there'}</button><button class="btn sm ghost" data-delord="${k}" aria-label="Remove">✕</button></div>`}).join('')||'<span class="dim" style="font-size:13px">No stops yet.</span>'}</div>
   <div class="row" style="margin-top:8px"><button class="btn ${UI.pickFor===v.id?'pri':''}" data-act="pick" data-v="${v.id}">${UI.pickFor===v.id?'Picking on the map…':'Add stops on the map'}</button></div></div>
   <div class="row">${v.state==='stop'?`<button class="btn pri" data-act="vstart" data-v="${v.id}">Start</button>`:`<button class="btn" data-act="vstop" data-v="${v.id}">Stop</button>`}
    ${VC[m.cls].cg.length>1&&v.amt===0?`<select class="btn sm" data-refit="${v.id}" aria-label="Refit for another cargo">${VC[m.cls].cg.map(c=>`<option value="${c}" ${c===v.cg?'selected':''}>Carries: ${CG[c].n}</option>`).join('')}</select>`:''}
    <span class="spacer"></span><button class="btn bad sm" data-act="vsell" data-v="${v.id}">Sell for ${eur(vehValue(v))}</button></div></div>`;
}
$('#insp').addEventListener('pointerenter',()=>UI.panelHover=true);$('#insp').addEventListener('pointerleave',()=>UI.panelHover=false);

/* ---------- windows ---------- */
function openWin(k){UI.win=k;renderWin()}
function closeWin(){UI.win=null;$('#win').hidden=true}
function renderWin(){
  const w=$('#win');if(!UI.win){w.hidden=true;return}let title='',body='';
  if(UI.win==='vehs'){title='Vehicles';body=S.vehs.length?`<div class="tw"><table class="tbl"><thead><tr><th>Vehicle</th><th>Cargo</th><th>Status</th><th class="n">Profit this year</th><th class="n">Last year</th><th class="n">Age</th></tr></thead><tbody>${S.vehs.map(v=>`<tr class="click" data-sel="veh:${v.id}" data-focus="1"><td><b>${esc(v.name)}</b></td><td>${cchip(v.cg)}</td><td>${STATE[v.state]}</td><td class="n ${v.pt<0?'bad':''}">${eur(v.pt)}</td><td class="n">${eur(v.pl)}</td><td class="n">${(v.age/365).toFixed(1)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="dim">You have no vehicles yet. Build a depot and buy your first one.</p>'}
  else if(UI.win==='towns'){title='Towns';body=`<div class="tw"><table class="tbl"><thead><tr><th>Town</th><th>Level</th><th class="n">Population</th><th class="n">Carried</th><th>Progress</th></tr></thead><tbody>${S.towns.slice().sort((a,b)=>townPop(b)-townPop(a)).map(t=>`<tr class="click" data-sel="town:${t.id}" data-focus="1"><td><b>${esc(t.name)}</b></td><td>${LV[t.lv].n}</td><td class="n">${num(townPop(t))}</td><td class="n">${Math.round(t.ltak/Math.max(1,t.lgen)*100)}%</td><td>${LV[t.lv+1]?`<span class="streak">${[0,1,2].map(k=>`<i class="${k<t.streak?'on':''}"></i>`).join('')}</span>`:'max'}</td></tr>`).join('')}</tbody></table></div>`}
  else if(UI.win==='inds'){title='Industries';body=`<div class="tw"><table class="tbl"><thead><tr><th>Industry</th><th>Produced last month</th><th class="n">Transported</th></tr></thead><tbody>${S.inds.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(o=>{const outs=outOf(o.t);const p=outs.reduce((s,c)=>s+(o.lpm[c]||0),0),tr=outs.reduce((s,c)=>s+(o.ltr[c]||0),0);return `<tr class="click" data-sel="ind:${o.id}" data-focus="1"><td><b>${esc(o.name)}</b></td><td>${outs.map(c=>cchip(c,' '+num(o.lpm[c]||0))).join(' ')||'<span class="dim">electricity</span>'}</td><td class="n">${p?Math.round(tr/p*100):0}%</td></tr>`}).join('')}</tbody></table></div>`}
  else if(UI.win==='fin'){title='Finances';const F=S.fin;const rows=[['Transport income','inc',1],['Vehicle running costs','run',-1],['Road and building upkeep','infra',-1],['Construction','build',-1],['New vehicles','veh',-1],['Loan interest','intr',-1],['Vehicles sold','sold',1]];
    const val=S.money-S.loan+S.vehs.reduce((s,v)=>s+vehValue(v),0);
    body=`<div class="tw"><table class="tbl"><thead><tr><th></th><th class="n">${yearOf(S.day)}</th><th class="n">${yearOf(S.day)-1}</th></tr></thead><tbody>${rows.map(([n,k,s])=>`<tr><td>${n}</td><td class="n ${s<0&&F.y[k]?'bad':''}">${s<0&&F.y[k]?'−':''}${eur(F.y[k]||0)}</td><td class="n">${F.ly?eur(F.ly[k]||0):'–'}</td></tr>`).join('')}
     <tr><td><b>Result</b></td><td class="n"><b>${eur(F.y.inc+F.y.sold-F.y.run-F.y.infra-F.y.build-F.y.veh-F.y.intr)}</b></td><td class="n">${F.ly?eur(F.ly.inc+F.ly.sold-F.ly.run-F.ly.infra-F.ly.build-F.ly.veh-F.ly.intr):'–'}</td></tr></tbody></table></div>
     <div class="sec" style="margin-top:14px"><h3>Income by cargo (${yearOf(S.day)})</h3><div class="row">${Object.entries(F.y.byc).sort((a,b)=>b[1]-a[1]).map(([c,a])=>cchip(c,' '+eur(a))).join('')||'<span class="dim">Nothing yet.</span>'}</div></div>
     <div class="sec" style="margin-top:14px"><h3>Bank loan</h3><div class="kv" style="max-width:360px"><span>Borrowed</span><span>${eur(S.loan)}</span><span>Limit</span><span>${eur(S.maxLoan)}</span><span>Interest</span><span>5% a year</span><span>Company value</span><span>${eur(val)}</span></div>
     <div class="row" style="margin-top:8px"><button class="btn" data-act="borrow" ${S.loan+50000>S.maxLoan?'disabled':''}>Borrow €50,000</button><button class="btn" data-act="repay" ${S.loan<=0||S.money<50000?'disabled':''}>Repay €50,000</button></div></div>`}
  else if(UI.win==='chains'){title='Production chains';const prim=Object.entries(IND).filter(([,d])=>d.pr);const proc=Object.entries(IND).filter(([,d])=>d.rec);
    body=`<p class="dim" style="margin-top:0">Take raw materials to processing plants and finished products to towns. Every link in a chain pays separately, so a long chain earns several times.</p>
     <div class="sec"><h3>Mines, farms and forests</h3>${prim.map(([k,d])=>`<div class="chain"><b>${d.n}</b><span class="ar">→</span>${Object.keys(d.pr).map(c=>cchip(c)).join(' ')}</div>`).join('')}</div>
     <div class="sec" style="margin-top:12px"><h3>Processing</h3>${proc.map(([k,d])=>d.rec.map(([i,o])=>`<div class="chain">${Object.keys(i).map(c=>cchip(c)).join(' + ')}<span class="ar">→</span><b>${d.n}</b><span class="ar">→</span>${Object.keys(o).map(c=>cchip(c)).join(' ')||'<span class="chip">electricity for towns</span>'}</div>`).join('')).join('')}</div>
     <div class="sec" style="margin-top:12px"><h3>Where products go</h3><div class="chain"><b>Towns</b><span class="ar">←</span>${TOWN_ACC.map(c=>cchip(c)).join(' ')}</div><div class="chain"><b>Bank (Town level and up)</b><span class="ar">←</span>${cchip('gold')} ${cchip('silver')}</div><div class="chain"><b>Farms, forests and mines</b><span class="ar">←</span>${cchip('machines')} <span class="dim">raise their output</span></div></div>
     <div class="sec" style="margin-top:12px"><h3>Town levels</h3>${LV.slice(2).map(L=>`<div class="chain"><b>${L.n}</b><span class="ar">needs every month:</span>${Object.entries(L.need).map(([c,a])=>`<span class="chip">${CATN[c]} ${a} t</span>`).join(' ')}${L.kinds?`<span class="chip">${L.kinds} kind${L.kinds>1?'s':''} of food</span>`:''}${L.pax?`<span class="chip">${L.pax}% of passengers carried</span>`:''}${L.power?'<span class="chip">electricity</span>':''}</div>`).join('')}</div>`}
  else if(UI.win==='help'){title='How to play';body=`<div style="display:grid;gap:10px;font-size:14px;max-width:62ch">
    <p style="margin:0"><b>Goal:</b> build a transport company that makes money, and help towns grow into cities.</p>
    <p style="margin:0"><b>1. Roads.</b> With the <b>Road</b> tool, drag from start to end, or click the start and then the end. Roads route around houses on their own. Over water they become bridges, which cost more.</p>
    <p style="margin:0"><b>2. Stops.</b> Build a <b>Stop</b> on a road. It collects and delivers everything within 3 tiles (the yellow square). In a town it needs at least 3 houses in range to accept goods.</p>
    <p style="margin:0"><b>3. Depot.</b> Build one next to a road. That is where you buy buses, mail vans and trucks. Each truck type carries different cargo.</p>
    <p style="margin:0"><b>4. Route.</b> In the vehicle panel, click “Add stops on the map” and pick stops, then “Start”. For raw materials, set the first stop to “Full load”.</p>
    <p style="margin:0"><b>5. Chains.</b> Coal to the power station, grain to the bakery, bread to towns… The <b>Chains</b> window shows them all. Pay depends on distance and speed, and milk and meat spoil quickly.</p>
    <p style="margin:0"><b>6. Towns.</b> Click a town to see what it needs for the next level. Meet it three months in a row and the town grows, with new houses and more passengers.</p>
    <p class="dim" style="margin:0">Controls: drag to move the map, scroll wheel or two fingers to zoom. Keys: R road, Z stop, G depot, X demolish, Space pause, arrows/WASD to scroll.</p>
    <p class="dim" style="margin:0">This is the first version. Ships, aircraft and railways come in later steps.</p></div>`}
  else if(UI.win==='menu'){title='Game';body=`<div style="display:grid;gap:12px">
    <p class="dim" style="margin:0">The game saves itself in this browser every month. To move to another device, copy your save code.</p>
    <div class="row"><button class="btn pri" data-act="copysave">Copy save code</button><button class="btn" data-act="loadbox">Load a save code</button></div><div id="savebox"></div>
    <div class="row"><button class="btn bad" data-act="newgame">New game…</button></div><div id="ngc"></div></div>`}
  w.innerHTML=`<div class="box" role="dialog" aria-modal="true"><div class="ph"><div style="flex:1"><h2>${title}</h2></div><button class="btn ghost sm" data-act="closewin" aria-label="Close">✕</button></div><div class="pb">${body}</div></div>`;w.hidden=false;
}
$('#win').addEventListener('click',e=>{if(e.target.id==='win')closeWin()});

/* ---------- tutorial ---------- */
function renderTut(){
  const el=$('#tut');if(!S||!S.started||S.tut.hide){el.hidden=true;return}
  const st=[['road','Build a road between two towns'],['stops','Build a stop in each of them',(S.tut.stops||0)>=2],['depot','Build a depot next to a road'],['veh','Buy a bus in the depot and give it both stops'],['cash','Make your first delivery']];
  const done=st.map(([k,,v])=>v!==undefined?v:!!S.tut[k]);
  if(done.every(Boolean)){el.innerHTML=`<h3>Well done! <button class="btn sm ghost" data-act="tuthide">Close</button></h3><p style="margin:0">Your company is running. Now try freight: a stop at a mine, another at a power station, and a dump truck. The <b>Chains</b> window shows what goes where.</p>`;el.hidden=false;return}
  el.innerHTML=`<h3>First steps <button class="btn sm ghost" data-act="tuthide" aria-label="Hide">✕</button></h3><ul>${st.map(([k,n],j)=>`<li class="${done[j]?'done':''}"><span>${done[j]?'✓':j+1+'.'}</span><span>${n}</span></li>`).join('')}</ul>`;el.hidden=false;
}

/* ---------- actions ---------- */
document.addEventListener('click',e=>{
  const sp=e.target.closest('[data-speed]');if(sp){const k=sp.dataset.speed;if(k==='p')UI.paused=!UI.paused;else{UI.paused=false;UI.speed=+k}renderBar();return}
  const tl=e.target.closest('[data-tool]');if(tl){setTool(tl.dataset.tool);return}
  const wn=e.target.closest('[data-win]');if(wn){openWin(wn.dataset.win);return}
  const sl=e.target.closest('[data-sel]');if(sl){const [k,id]=sl.dataset.sel.split(':');select(k,+id);if(sl.dataset.focus){closeWin();focusSel()}return}
  const cl=e.target.closest('[data-cls]');if(cl){UI.depCls=cl.dataset.cls;renderInsp(true);return}
  const by=e.target.closest('[data-buy]');if(by){const d=depById(+by.dataset.dep);const v=buyVehicle(d,by.dataset.buy,by.dataset.cg);if(v){toast(`Bought ${v.name}. Now add its stops.`,'good');UI.pickFor=v.id;select('veh',v.id);renderHint()}return}
  const fu=e.target.closest('[data-full]');if(fu){const v=vehById(UI.sel.id);const o=v.orders[+fu.dataset.full];o.full=!o.full;renderInsp(true);return}
  const dl=e.target.closest('[data-delord]');if(dl){const v=vehById(UI.sel.id);v.orders.splice(+dl.dataset.delord,1);if(v.oi>=v.orders.length)v.oi=0;if(!v.orders.length&&v.state!=='stop'){v.state='stop'}renderInsp(true);return}
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,val=el.dataset.v;
  switch(a){
    case 'close':closeInsp();break;
    case 'closewin':closeWin();break;
    case 'pick':UI.pickFor=UI.pickFor===+val?null:+val;setToolKeep();renderHint();renderInsp(true);break;
    case 'pickdone':UI.pickFor=null;renderHint();renderInsp(true);break;
    case 'vstart':{const v=vehById(+val);UI.pickFor=null;renderHint();startVeh(v);renderInsp(true);break}
    case 'vstop':{const v=vehById(+val);v.state='stop';renderInsp(true);break}
    case 'vsell':{const v=vehById(+val);const p=vehValue(v);S.money+=p;S.fin.y.sold+=p;S.vehs=S.vehs.filter(x=>x!==v);if(UI.pickFor===v.id)UI.pickFor=null;closeInsp();toast(`${v.name} sold for ${eur(p)}.`);break}
    case 'demst':{const st=stById(+val);demolish(st.i);break}
    case 'demdep':{const d=depById(+val);demolish(d.i);break}
    case 'borrow':S.loan+=50000;S.money+=50000;renderWin();break;
    case 'repay':S.loan-=50000;S.money-=50000;renderWin();break;
    case 'tuthide':S.tut.hide=true;renderTut();break;
    case 'copysave':{const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));$('#savebox').innerHTML=`<textarea class="inp" readonly aria-label="Save code">${code}</textarea>`;try{navigator.clipboard.writeText(code).then(()=>toast('Save code copied.'),()=>toast('Select the code and copy it.'))}catch(err){toast('Select the code and copy it.')}break}
    case 'loadbox':$('#savebox').innerHTML=`<textarea class="inp" id="loadcode" placeholder="Paste a save code here" aria-label="Save code"></textarea><div class="row" style="margin-top:6px"><button class="btn pri" data-act="doload">Load</button></div>`;break;
    case 'doload':try{const o=JSON.parse(decodeURIComponent(escape(atob($('#loadcode').value.trim()))));if(!o||o.v!==1)throw 0;S=o;CACHE={ver:-1};closeWin();closeInsp();afterLoad();toast('Game loaded.')}catch(err){toast("That code can't be read. Paste the whole thing.",'bad')}break;
    case 'newgame':$('#ngc').innerHTML=`<div class="row"><span class="bad">Your current game will be lost.</span><button class="btn bad" data-act="newgame2">Yes, start over</button></div>`;break;
    case 'newgame2':try{localStorage.removeItem(SAVE)}catch(err){}closeWin();closeInsp();newGameScreen();break;
    case 'regen':genWorld();CACHE={ver:-1};resetCam();break;
    case 'begin':{const nm=($('#coname').value||'').trim();S.co=nm||'My Transport Co.';S.started=true;$('#start').hidden=true;UI.paused=false;news(`${S.co} opens for business on 1 January 1950.`,'good');save();renderBar();renderTut();break}
    case 'restart':newGameScreen();break;
  }
});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.refit){const v=vehById(+el.dataset.refit);if(v&&v.amt===0){v.cg=el.value;toast(`${v.name} now carries ${CG[v.cg].n.toLowerCase()}.`)}renderInsp(true)}});
function setToolKeep(){if(UI.tool!=='sel'){UI.tool='sel';renderTools()}}
function focusSel(){if(!UI.sel)return;const {k,id}=UI.sel;let fx,fy;if(k==='town'){const t=townById(id);fx=t.x;fy=t.y}else if(k==='ind'){const o=indById(id);fx=o.x+1.5;fy=o.y+1.5}else if(k==='veh'){const p=vehPos(vehById(id));fx=p.fx;fy=p.fy}else if(k==='st'){const s=stById(id);fx=TX(s.i);fy=TY(s.i)}if(fx!=null)centerOn(fx,fy)}

/* ---------- save / start ---------- */
function save(){if(!S||!S.started)return;try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}
function load(){try{const s=localStorage.getItem(SAVE);if(s){const o=JSON.parse(s);if(o&&o.v===1&&o.started)return o}}catch(e){}return null}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
function resetCam(){UI.cam.z=VW<700?.7:1;const t=S.towns[0];centerOn(t.x+.5,t.y+.5)}
function afterLoad(){CACHE={ver:-1};resetCam();renderBar();renderTools();renderTut();$('#start').hidden=true}
function newGameScreen(){
  genWorld();CACHE={ver:-1};resetCam();renderBar();renderTools();$('#tut').hidden=true;
  $('#start').innerHTML=`<div class="card"><div class="signbig"><h1>Freight<span>Empire</span></h1></div>
   <p class="dim" style="margin:0 0 16px;font-size:15px">It is 1950. The country has towns, farms, mines and factories, but no transport. Build roads, buy buses and trucks, carry raw materials to the plants and finished goods to the towns. Towns that get what they need will grow.</p>
   <div class="field"><label class="faint" style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700" for="coname">Your company name</label><input id="coname" maxlength="32" placeholder="My Transport Co."></div>
   <div class="row" style="margin-top:16px"><button class="btn" data-act="regen">Another map</button><span class="spacer"></span><button class="btn pri" data-act="begin" style="font-size:16px;padding:9px 16px">Found the company</button></div>
   <p class="faint" style="font-size:12px;margin:12px 0 0">Step 1 of the plan: roads, buses, mail and trucks. Ships, aircraft and railways come later.</p></div>`;
  $('#start').hidden=false;
}
function showGameOver(){openWinRaw('Company closed',`<p>The bank has closed ${esc(S.co)} after six months in the red.</p><div class="row"><button class="btn pri" data-act="restart">New game</button></div>`)}
function openWinRaw(title,body){const w=$('#win');w.innerHTML=`<div class="box" role="dialog" aria-modal="true"><div class="ph"><div style="flex:1"><h2>${title}</h2></div></div><div class="pb">${body}</div></div>`;w.hidden=false}
window.addEventListener('resize',()=>{resize()});
function start(data){
  resize();renderTools();
  const s=(data&&data.S&&data.S.v===1&&data.S.started)?data.S:load();
  if(s){S=s;afterLoad()}else newGameScreen();
  requestAnimationFrame(frame);
}
try{window.claude?.hot?.snapshot?.(()=>({S:S&&S.started?S:null}))}catch(e){}
if(window.claude?.hot?.ready)window.claude.hot.ready(start);else start(window.claude?.hot?.data??{});
</script>
</body>
</html>
