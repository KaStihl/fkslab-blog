# Netlify build + response headers for fkslab.com.
# Pinning HUGO_VERSION matters: the layouts use the Hugo >= 0.146 directory names
# (layouts/_partials, layouts/_shortcodes), so an older default Netlify Hugo breaks the build.

[build]
  command = "hugo --gc --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.164.0"
  HUGO_ENV = "production"
  TZ = "Europe/Vienna"

[context.deploy-preview]
  command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # Scoped on purpose: no script-src/default-src, because PaperMod ships inline scripts for the
    # theme toggle. These directives block clickjacking, <base> hijacking, plugins and form
    # re-targeting without breaking the Power BI iframe (frame-src is left open).
    Content-Security-Policy = "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'"

# Fingerprinted theme assets (PaperMod/Hugo add a content hash to the file name).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/logo/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
