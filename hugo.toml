baseURL = "https://fkslab.netlify.app/"
title = "FK's LAB"
theme = "PaperMod"
paginate = 10
defaultContentLanguage = "sk"
defaultContentLanguageInSubdir = false

[markup]
  [markup.goldmark.renderer]
    unsafe = true

[languages]
  [languages.sk]
    label = "Slovenčina"
    locale = "sk-SK"
    weight = 1
    [languages.sk.params]
      description = "Osobné dátové projekty — Power BI, automatizácia a analytika"
      [languages.sk.params.homeInfoParams]
        Title = "Z dát k rozhodnutiam"
        Content = """
Osobné dátové projekty popri plnom úväzku — **Power BI dashboardy**, **automatizácia** a **analytika**, ktoré ma jednoducho bavia. Aktuálny showcase: živé sledovanie leteckej dopravy medzi [Viedňou a Bratislavou](/projekty/vie-bts-tracker/).
"""
    [[languages.sk.menu.main]]
      identifier = "about"
      name = "O mne"
      url = "/about/"
      weight = 10
    [[languages.sk.menu.main]]
      identifier = "projekty"
      name = "Projekty"
      url = "/projekty/"
      weight = 30
    [[languages.sk.menu.main]]
      identifier = "dashboard"
      name = "Dashboard"
      url = "/dashboard/"
      weight = 40
    [[languages.sk.menu.main]]
      identifier = "contact"
      name = "Kontakt"
      url = "/contact/"
      weight = 50

  [languages.en]
    label = "English"
    locale = "en-US"
    weight = 2
    [languages.en.params]
      description = "Personal data projects — Power BI, automation and analytics"
      [languages.en.params.homeInfoParams]
        Title = "Turning data into decisions"
        Content = """
Personal data projects on the side of a full-time job — **Power BI dashboards**, **automation**, and **analytics** I genuinely enjoy. Current showcase: live tracking of air traffic between [Vienna and Bratislava](/projekty/vie-bts-tracker/).
"""
    [[languages.en.menu.main]]
      identifier = "about"
      name = "About"
      url = "/about/"
      weight = 10
    [[languages.en.menu.main]]
      identifier = "projekty"
      name = "Projects"
      url = "/projekty/"
      weight = 30
    [[languages.en.menu.main]]
      identifier = "dashboard"
      name = "Dashboard"
      url = "/dashboard/"
      weight = 40
    [[languages.en.menu.main]]
      identifier = "contact"
      name = "Contact"
      url = "/contact/"
      weight = 50

  [languages.de]
    label = "Deutsch"
    locale = "de-DE"
    weight = 3
    [languages.de.params]
      description = "Persönliche Datenprojekte — Power BI, Automatisierung und Analytik"
      [languages.de.params.homeInfoParams]
        Title = "Aus Daten werden Entscheidungen"
        Content = """
Persönliche Datenprojekte neben einer Vollzeitstelle — **Power BI Dashboards**, **Automatisierung** und **Analytik**, die mir wirklich Spaß machen. Aktuelles Projekt: Live-Tracking des Flugverkehrs zwischen [Wien und Bratislava](/projekty/vie-bts-tracker/).
"""
    [[languages.de.menu.main]]
      identifier = "about"
      name = "Über mich"
      url = "/about/"
      weight = 10
    [[languages.de.menu.main]]
      identifier = "projekty"
      name = "Projekte"
      url = "/projekty/"
      weight = 30
    [[languages.de.menu.main]]
      identifier = "dashboard"
      name = "Dashboard"
      url = "/dashboard/"
      weight = 40
    [[languages.de.menu.main]]
      identifier = "contact"
      name = "Kontakt"
      url = "/contact/"
      weight = 50

[params]
  env = "production"
  title = "FK's Lab"
  defaultTheme = "dark"
  disableThemeToggle = false
  displayFullLangName = true
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  comments = false

  [params.label]
    text = "FK's Lab"
    icon = "/logo/fk-monogram-tile.png"
    iconHeight = 32

  [params.assets]
    favicon = "/favicon.ico"
    favicon16x16 = "/favicon-16x16.png"
    favicon32x32 = "/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"
    theme_color = "#0B1A2B"
    msapplication_TileColor = "#0B1A2B"

  [[params.socialIcons]]
    name = "github"
    title = "GitHub"
    url = "https://github.com/KaStihl"

  [[params.socialIcons]]
    name = "email"
    title = "Email"
    url = "mailto:ferdinand.fojtlin@gmail.com"
